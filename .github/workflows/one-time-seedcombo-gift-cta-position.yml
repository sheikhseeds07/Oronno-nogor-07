name: Position Seedcombo Gift CTA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move gift CTA below gift section
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/landing/CleanLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old_top = '{(C.gift_title_1||C.gift_title_2||C.gift_image)&&<Reveal>{C.gift_cta_text&&<RedCta label={C.gift_cta_text}/>}<div className="mt-4 rounded-2xl bg-white border border-emerald-100 p-4 text-center">'
          new_top = '{(C.gift_title_1||C.gift_title_2||C.gift_image)&&<Reveal><div className="mt-4 rounded-2xl bg-white border border-emerald-100 p-4 text-center">'
          old_after = '</div></Reveal>}\n <Reveal><table className="combo-table">'
          new_after = '</div></Reveal>}\n {C.gift_cta_text&&<div className="mt-3"><RedCta label={C.gift_cta_text}/></div>}\n <Reveal><table className="combo-table">'
          if old_top not in s:
              raise SystemExit('Expected gift CTA markup not found')
          if old_after not in s:
              raise SystemExit('Expected gift/seed boundary not found')
          s = s.replace(old_top, new_top, 1)
          s = s.replace(old_after, new_after, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/CleanLandingPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Move seedcombo gift CTA below gift section'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/one-time-seedcombo-gift-cta-position.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-seedcombo-gift-cta-position.yml
          git commit -m 'Remove one-time seedcombo CTA patch workflow'
          git push
