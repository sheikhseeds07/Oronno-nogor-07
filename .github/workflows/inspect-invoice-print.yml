name: Inspect invoice print code
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect invoice-related JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/admin/orders.tsx')
          s=p.read_text()
          keys=['Invoice ID','invoice_no','Print Invoice','print','AA']
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  print(f'--- lines {max(1,i-3)}-{min(len(lines),i+4)} ---')
                  for j in range(max(0,i-3),min(len(lines),i+4)):
                      print(f'{j+1}: {lines[j]}')
          PY
