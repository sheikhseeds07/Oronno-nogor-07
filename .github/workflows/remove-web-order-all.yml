name: Remove Web Order All Filter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Web Order All filter
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/routes/admin/orders.tsx")
          s = p.read_text(encoding="utf-8")
          old = '''        {mode !== "list" && (\n          <button\n            onClick={() => setFilter("all")}\n            className={`px-3.5 py-1.5 rounded-full text-xs whitespace-nowrap font-bold inline-flex items-center gap-1.5 transition-all duration-200 ${\n              filter === "all"\n                ? "bg-gradient-to-br from-brand to-brand-dark text-white shadow-md scale-105"\n                : "bg-white border border-slate-200 text-slate-700 hover:border-brand/40 hover:shadow-sm"\n            }`}\n          >\n            সব\n            <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${filter === "all" ? "bg-white/25" : "bg-slate-100 text-slate-600"}`}>\n              {Object.values(counts ?? {}).reduce((s, n) => s + n, 0)}\n            </span>\n          </button>\n        )}\n'''
          if old not in s:
              raise SystemExit("All filter block not found; no change made")
          p.write_text(s.replace(old, ""), encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove All filter from Web Order"
          git push
