name: Finish order improvements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Apply changes and commit
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/admin-order.functions.ts')
          s = p.read_text()
          old = '''        payment_method: "cod",\n      })'''
          new = '''        payment_method: "cod",\n        created_by: context.userId,\n      })'''
          if old in s:
              p.write_text(s.replace(old, new, 1))

          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()

          replacements = [
            ('''  assigned_to?: string | null;\n};''', '''  assigned_to?: string | null;\n  created_by?: string | null;\n};'''),
            ('id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,printed_at,created_at,updated_at,order_items', 'id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,printed_at,created_at,updated_at,created_by,order_items'),
            ('''          lockMap={lockMap}\n          currentUserId={currentUserId}\n          empty=''', '''          lockMap={lockMap}\n          currentUserId={currentUserId}\n          creatorMap={creatorMap}\n          empty='''),
            ('''  lockMap?: Map<string, { user_id: string; user_name: string }>;\n  currentUserId?: string | null;\n}) {''', '''  lockMap?: Map<string, { user_id: string; user_name: string }>;\n  currentUserId?: string | null;\n  creatorMap?: Map<string, string>;\n}) {'''),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)

          needle = '''  const { data: orders, isFetching } = useQuery({\n    queryKey: ["admin-orders", mode, filter],\n    enabled: !isIncomplete,\n    staleTime: 15_000,\n    placeholderData: keepPreviousData,\n    queryFn: async () => {\n      const list = (filter === "all" ? statuses : [filter]).filter((s) => s !== "incomplete");\n      const { data: ords } = await supabase\n        .from("orders")\n        .select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,printed_at,created_at,updated_at,created_by,order_items(id,product_name,quantity,price,product_id)")\n        .in("status", list as Exclude<OrderStatus, "incomplete">[])\n        .order("created_at", { ascending: false })\n        .limit(500);\n      return await attachProductImages((ords ?? []) as unknown as OrderRow[]);\n    },\n  });\n'''
          if 'const creatorIds = Array.from(new Set((orders ?? []).map((o) => o.created_by)' not in s and needle in s:
              insert = needle + '''\n  const creatorIds = Array.from(new Set((orders ?? []).map((o) => o.created_by).filter((x): x is string => !!x)));\n  const { data: creatorProfiles } = useQuery({\n    queryKey: ["order-creators", creatorIds.join(",")],\n    enabled: creatorIds.length > 0,\n    queryFn: async () => {\n      const { data, error } = await supabase.from("profiles").select("id,full_name").in("id", creatorIds);\n      if (error) throw new Error(error.message);\n      return data ?? [];\n    },\n    staleTime: 60_000,\n  });\n  const creatorMap = useMemo(() => new Map((creatorProfiles ?? []).map((p) => [p.id, p.full_name || "Unknown user"])), [creatorProfiles]);\n'''
              s = s.replace(needle, insert, 1)

          old = '''                    if (lockedByOther) {\n                      return (\n                        <Link\n                          to="/admin/orders"\n                          search={linkSearch}\n                          onClick={handleClick}\n                          className="inline-flex flex-col items-end gap-0.5 px-2.5 py-1.5 rounded border border-red-300 bg-red-50 text-red-700 text-xs font-semibold hover:bg-red-100 animate-pulse"\n                          title={`${lock.user_name} এই অর্ডারটি ওপেন করেছেন — ক্লিক করলে ওয়ারনিং + টেকওভার অপশন আসবে`}\n                        >\n                          <span className="inline-flex items-center gap-1">\n                            <span className="w-1.5 h-1.5 rounded-full bg-red-500" />\n                            লকড · Open\n                          </span>\n                          <span className="text-[10px] font-normal text-red-600 max-w-[140px] truncate">{lock.user_name}</span>\n                        </Link>\n                      );\n                    }\n                    return (\n                      <Link\n                        to="/admin/orders"\n                        search={linkSearch}\n                        onClick={handleClick}\n                        className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-blue-200 bg-blue-50 text-blue-700 text-xs font-semibold hover:bg-blue-100"\n                        title="অর্ডার ওপেন (রাইট ক্লিক / নতুন ট্যাবে খুলুন)"\n                      >\n                        Open <ExternalLink className="w-3 h-3" />\n                      </Link>\n                    );'''
          new = '''                    const creatorName = o.created_by ? creatorMap?.get(o.created_by) : undefined;\n                    if (lockedByOther) {\n                      return (\n                        <div className="flex flex-col items-end">\n                          <Link\n                            to="/admin/orders"\n                            search={linkSearch}\n                            onClick={handleClick}\n                            className="inline-flex flex-col items-end gap-0.5 px-2.5 py-1.5 rounded border border-red-300 bg-red-50 text-red-700 text-xs font-semibold hover:bg-red-100 animate-pulse"\n                            title={`${lock.user_name} এই অর্ডারটি ওপেন করেছেন — ক্লিক করলে ওয়ারনিং + টেকওভার অপশন আসবে`}\n                          >\n                            <span className="inline-flex items-center gap-1">\n                              <span className="w-1.5 h-1.5 rounded-full bg-red-500" />\n                              লকড · Open\n                            </span>\n                            <span className="text-[10px] font-normal text-red-600 max-w-[140px] truncate">{lock.user_name}</span>\n                          </Link>\n                          {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}\n                        </div>\n                      );\n                    }\n                    return (\n                      <div className="flex flex-col items-end">\n                        <Link\n                          to="/admin/orders"\n                          search={linkSearch}\n                          onClick={handleClick}\n                          className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-blue-200 bg-blue-50 text-blue-700 text-xs font-semibold hover:bg-blue-100"\n                          title="অর্ডার ওপেন (রাইট ক্লিক / নতুন ট্যাবে খুলুন)"\n                        >\n                          Open <ExternalLink className="w-3 h-3" />\n                        </Link>\n                        {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}\n                      </div>\n                    );'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''          {items.map((i, idx) => (\n            <div key={i.product_id} className="flex items-center gap-2 py-2 border-b">\n              <div className="flex-1">\n                <div className="text-sm font-semibold">{i.product_name}</div>\n                <div className="text-xs text-muted-foreground">{taka(i.price)} × {i.quantity}</div>\n              </div>\n              <input\n                type="number" min={1} value={i.quantity}\n                onChange={(e) => {\n                  const qty = Math.max(1, Number(e.target.value));\n                  setItems((prev) => prev.map((x, ix) => ix === idx ? { ...x, quantity: qty } : x));\n                }}\n                className="w-16 border rounded px-2 py-1 text-sm"\n              />\n              <button onClick={() => setItems((prev) => prev.filter((_, ix) => ix !== idx))} className="p-1.5 text-red-600 hover:bg-red-50 rounded">\n                <Trash2 className="w-4 h-4" />\n              </button>\n            </div>\n          ))}'''
          new = '''          {items.map((i, idx) => (\n            <div key={i.product_id} className="flex items-center gap-2 py-2 border-b">\n              <div className="flex-1 min-w-0">\n                <div className="text-sm font-semibold truncate">{i.product_name}</div>\n                <div className="text-xs text-muted-foreground">পণ্যের মূল্য কাস্টমাইজ করা যাবে</div>\n              </div>\n              <div className="w-24">\n                <div className="text-[10px] text-muted-foreground mb-0.5">Price</div>\n                <input type="number" min={0} step="0.01" value={i.price} onChange={(e) => { const price = Math.max(0, Number(e.target.value)); setItems((prev) => prev.map((x, ix) => ix === idx ? { ...x, price } : x)); }} className="w-full border rounded px-2 py-1 text-sm font-semibold" />\n              </div>\n              <div className="w-16">\n                <div className="text-[10px] text-muted-foreground mb-0.5">Qty</div>\n                <input type="number" min={1} value={i.quantity} onChange={(e) => { const qty = Math.max(1, Number(e.target.value)); setItems((prev) => prev.map((x, ix) => ix === idx ? { ...x, quantity: qty } : x)); }} className="w-full border rounded px-2 py-1 text-sm" />\n              </div>\n              <div className="w-20 text-right">\n                <div className="text-[10px] text-muted-foreground">Total</div>\n                <div className="text-sm font-bold">{taka(i.price * i.quantity)}</div>\n              </div>\n              <button onClick={() => setItems((prev) => prev.filter((_, ix) => ix !== idx))} className="p-1.5 text-red-600 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>\n            </div>\n          ))}'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
