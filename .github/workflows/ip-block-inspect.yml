name: Inspect IP block state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ip-block-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump block objects
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, traceback
          from pathlib import Path
          out = {}
          def run(name, q):
              try:
                  req = urllib.request.Request(
                      "https://api.supabase.com/v1/projects/%s/database/query" % os.environ.get('PROJECT_REF',''),
                      data=json.dumps({'query': q}).encode(),
                      headers={'Authorization': 'Bearer %s' % os.environ.get('SUPABASE_ACCESS_TOKEN',''), 'Content-Type': 'application/json', 'User-Agent': 'gh-actions-inspect/1.0'},
                      method='POST')
                  with urllib.request.urlopen(req, timeout=120) as r:
                      out[name] = json.loads(r.read().decode())
              except Exception as e:
                  body = ''
                  try:
                      body = e.read().decode()
                  except Exception:
                      body = traceback.format_exc()
                  out[name] = {'error': str(e), 'body': body}
          run('functions', "select p.proname, pg_get_functiondef(p.oid) as def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('block_customer','unblock_customer','is_blocked_visitor','list_customer_blocks','place_public_order') order by p.proname")
          run('cb_cols', "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='customer_blocks' order by ordinal_position")
          run('orders_ip', "select count(*) as total, count(client_ip) as with_ip from public.orders")
          run('recent_blocks', "select id, phone, ip_address, is_active, blocked_at from public.customer_blocks order by blocked_at desc limit 10")
          Path('.diagnostics').mkdir(exist_ok=True)
          Path('.diagnostics/ip-block-inspect.json').write_text(json.dumps(out, indent=1))
          print(json.dumps(out)[:2000])
          PYCODE
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .diagnostics
          touch .diagnostics/ip-block-inspect.json
          git add -A .diagnostics
          git commit -m "chore: ip block diagnostics" || echo "no changes"
          git push
