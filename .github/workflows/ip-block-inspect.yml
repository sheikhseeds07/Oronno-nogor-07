name: Inspect IP block state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ip-block-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump block-related database objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          from pathlib import Path

          def run(q):
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
                  data=json.dumps({'query': q}).encode(),
                  headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions-IpBlockInspect/1.0'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {'error': e.read().decode()}

          out = {}
          out['functions'] = run("""
            select p.proname, pg_get_functiondef(p.oid) as def
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname in ('block_customer','unblock_customer','is_blocked_visitor','list_customer_blocks','place_public_order','upsert_incomplete_checkout')
            order by p.proname
          """)
          out['customer_blocks_cols'] = run("""
            select column_name, data_type from information_schema.columns
            where table_schema='public' and table_name='customer_blocks' order by ordinal_position
          """)
          out['blocked_visitors_exists'] = run("""
            select table_name from information_schema.tables
            where table_schema='public' and table_name in ('blocked_visitors','customer_blocks','customer_devices','customer_profiles')
          """)
          out['orders_ip_cols'] = run("""
            select column_name from information_schema.columns
            where table_schema='public' and table_name='orders' and column_name ilike '%ip%'
          """)
          out['orders_ip_fill'] = run("""
            select count(*) as total, count(client_ip) as with_ip from public.orders
          """)
          out['recent_blocks'] = run("""
            select id, customer_name, phone, ip_address, is_active, blocked_at from public.customer_blocks
            order by blocked_at desc limit 10
          """)
          out['policies'] = run("""
            select tablename, policyname, cmd, roles::text, qual from pg_policies
            where schemaname='public' and tablename='customer_blocks'
          """)
          Path('.diagnostics').mkdir(exist_ok=True)
          Path('.diagnostics/ip-block-inspect.json').write_text(json.dumps(out, indent=1))
          PYCODE
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/ip-block-inspect.json
          git commit -m "chore: ip block diagnostics" || echo "no changes"
          git push
