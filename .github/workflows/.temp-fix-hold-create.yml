name: Temporary Hold Create Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Temp patch workflow for hold order create action')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hold create action and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = 'const isWebStage = detail.status === "web_pending" || detail.status === "incomplete";'
          new = 'const isWebStage = detail.status === "web_pending" || detail.status === "incomplete" || detail.status === "hold";'
          if old not in s:
              raise SystemExit('Expected target line not found; aborting without changes.')
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one target line; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/.temp-fix-hold-create.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git commit -m "Fix hold order create action"
          git push origin main
