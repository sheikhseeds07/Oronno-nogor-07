name: restore-employee-perf
on: push
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'restore-employee-perf')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git show b9f42f24ffef401d58832b60af04a87f6c3776b8:src/components/admin/PremiumDashboard.tsx > /tmp/prev.tsx
          python3 .github/restore_perf.py
          git rm -q .github/workflows/restore-employee-perf.yml .github/restore_perf.py
          git config user.name shawon079
          git config user.email 146602441+shawon079@users.noreply.github.com
          git add -A
          git commit -m "Restore employee confirm / web cancel / incomplete cancel split with drilldown"
          git push
