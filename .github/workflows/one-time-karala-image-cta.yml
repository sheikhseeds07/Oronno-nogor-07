name: One-time Karala image CTA patch

on:
  push:
    branches: [fix/karala-image-cta-final3]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Karala CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/landing/ProductStyleLandingPage.tsx')
          s=p.read_text()
          if 'hng-karala-image-cta' in s:
              print('CTA already present; nothing to do.')
              raise SystemExit(0)
          pat=r'<img\b(?=[^>]*src=\{toImg\(heroImage\)\})[^>]*?/>'
          m=re.search(pat,s,re.S)
          if not m:
              raise SystemExit('Could not locate hero image; aborting without changes.')
          cta='''
{slug === "karala" && <div className="hng-karala-image-cta"><button type="button" onClick={goOrder}><span>{page?.cta_text || "এখনই অর্ডার করুন"}</span><span aria-hidden="true">→</span></button></div>}'''
          s=s[:m.end()]+cta+s[m.end():]
          anchor='.hng-image-compact-cta{display:flex;justify-content:center;margin:8px 0 2px}'
          css='''.hng-karala-image-cta{display:flex;justify-content:center;margin:8px 0 2px;width:100%}.hng-karala-image-cta button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:min(320px,100%);height:54px;min-height:54px;padding:0 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#15803d,#166534 55%,#14532d);color:#fff;font-size:17px;font-weight:900;line-height:1;box-shadow:0 10px 26px rgba(22,101,52,.24);overflow:hidden;isolation:isolate;will-change:transform,box-shadow;animation:hngKaralaCtaPulse 2.8s ease-in-out infinite;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease,filter .22s ease}.hng-karala-image-cta button:before{content:"";position:absolute;inset:-20% auto -20% -45%;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%) skewX(-18deg);animation:hngKaralaCtaShine 3.6s ease-in-out infinite;pointer-events:none}.hng-karala-image-cta button span{position:relative;z-index:1}.hng-karala-image-cta button:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(22,101,52,.32);filter:saturate(1.06)}.hng-karala-image-cta button:active{transform:translateY(-1px) scale(.985)}.hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order,.hng-karala-image-cta button{width:min(320px,100%)!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important}.hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order{display:flex;align-items:center;justify-content:center}.hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order{padding:0 22px!important}@keyframes hngKaralaCtaPulse{0%,100%{transform:translateY(0);box-shadow:0 10px 26px rgba(22,101,52,.24),0 0 0 0 rgba(34,197,94,.16)}50%{transform:translateY(-2px);box-shadow:0 14px 32px rgba(22,101,52,.30),0 0 0 7px rgba(34,197,94,0)}}@keyframes hngKaralaCtaShine{0%,35%{transform:translateX(-140%) skewX(-18deg);opacity:0}45%{opacity:.7}70%,100%{transform:translateX(320%) skewX(-18deg);opacity:0}}@media (max-width:640px){.hng-karala-image-cta{margin:7px 0 2px}.hng-karala-image-cta button{height:52px!important;min-height:52px!important;font-size:16px}}@media (prefers-reduced-motion:reduce){.hng-karala-image-cta button{animation:none!important}.hng-karala-image-cta button:before{animation:none!important}}'''
          if anchor not in s:
              raise SystemExit('CSS anchor not found; aborting without changes.')
          s=s.replace(anchor,anchor+css,1)
          p.write_text(s)
          PY
      - name: Verify, commit patch, and remove this workflow
        run: |
          grep -q 'hng-karala-image-cta' src/components/landing/ProductStyleLandingPage.tsx
          grep -q 'slug === "karala"' src/components/landing/ProductStyleLandingPage.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx
          git commit -m 'feat: add Karala image CTA and unify CTA sizing'
          git push
          git rm .github/workflows/one-time-karala-image-cta.yml
          git commit -m 'chore: remove one-time Karala patch workflow'
          git push
