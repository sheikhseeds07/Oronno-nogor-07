name: One-time seedcombo compact selector
on:
  push:
    branches: [main]
jobs:
  compact:
    if: ${{ !contains(github.event.head_commit.message, 'seedcombo compact selector') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact seedcombo product selector
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/landing.$slug.tsx')
          s = p.read_text()
          marker = '#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button { min-height:54px !important; padding:7px 9px !important; border-radius:14px !important; transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease !important; }'
          add = '''
#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button { min-height:48px !important; padding:5px 7px !important; border-radius:12px !important; }
#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button img { width:40px !important; height:40px !important; min-width:40px !important; min-height:40px !important; object-fit:cover !important; border-radius:9px !important; flex:0 0 40px !important; }
#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button p,
#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button span { white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; line-height:1.15 !important; }
#order #lp-order-form > .border-2.rounded-2xl.p-3 .space-y-2 > button svg { flex-shrink:0 !important; }
'''
          if marker not in s:
              raise SystemExit('marker not found')
          if 'seedcombo compact selector' in s:
              raise SystemExit(0)
          s = s.replace(marker, marker + add)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/landing.$slug.tsx
          git commit -m 'seedcombo compact selector [skip ci]' || exit 0
          git push
