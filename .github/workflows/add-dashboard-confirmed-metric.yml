name: Add dashboard confirmed metric

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: dashboard today confirmed metric'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard and confirmation tracking
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/lib/dashboard-optimized.functions.ts')
          s = p.read_text()
          anchor = 'export const getOptimizedDashboardReport = createServerFn'
          if 'getTodayWebConfirmedOrderCount' not in s:
              fn = '''export const getTodayWebConfirmedOrderCount = createServerFn({ method: "POST" })
                .middleware([requireSupabaseAuth])
                .handler(async ({ context }) => {
                  const role = await supabaseAdmin
                    .from("user_roles")
                    .select("role")
                    .eq("user_id", context.userId)
                    .in("role", ["admin", "super_admin", "employee"])
                    .limit(1);
                  if (role.error) throw new Error(role.error.message);
                  if (!role.data?.length) throw new Error("Unauthorized");

                  const start = new Date(new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Dhaka" }) + "T00:00:00+06:00").toISOString();
                  const { count, error } = await supabaseAdmin
                    .from("orders")
                    .select("id", { count: "exact", head: true })
                    .eq("source", "web")
                    .gte("confirmed_at", start);
                  if (error) throw new Error(error.message);
                  return Number(count ?? 0);
                });

          '''
              s = s.replace(anchor, fn + anchor, 1)
          p.write_text(s)

          p = Path('src/lib/admin-order.functions.ts')
          s = p.read_text()
          old = 'const updates = { customer_name: data.customer_name, customer_phone: data.customer_phone, customer_address: data.customer_address ?? null, thana: data.thana ?? null, district: data.district ?? null, notes: data.notes ?? null, subtotal: data.subtotal, delivery_fee: data.delivery_fee, discount: data.discount, total: data.total, ...(data.confirm ? { status: "pending" as const, created_by: context.userId } : {}) };'
          new = 'const updates: any = { customer_name: data.customer_name, customer_phone: data.customer_phone, customer_address: data.customer_address ?? null, thana: data.thana ?? null, district: data.district ?? null, notes: data.notes ?? null, subtotal: data.subtotal, delivery_fee: data.delivery_fee, discount: data.discount, total: data.total, ...(data.confirm ? { status: "pending" as const, created_by: context.userId, confirmed_at: new Date().toISOString(), confirmed_by: context.userId } : {}) };'
          if old not in s:
              raise SystemExit('admin order update block not found; refusing to modify')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/components/admin/PremiumDashboard.tsx')
          s = p.read_text()
          s = s.replace('getOptimizedDashboardReport, getWebProcessingOrderCount', 'getOptimizedDashboardReport, getWebProcessingOrderCount, getTodayWebConfirmedOrderCount', 1)
          s = s.replace('const fetchProcessing=useServerFn(getWebProcessingOrderCount);', 'const fetchProcessing=useServerFn(getWebProcessingOrderCount);const fetchConfirmed=useServerFn(getTodayWebConfirmedOrderCount);', 1)
          s = s.replace('const {data:processingCount=0}=useQuery({queryKey:["live-web-processing"],queryFn:()=>fetchProcessing(),staleTime:0,refetchOnWindowFocus:true,refetchInterval:15000});', 'const {data:processingCount=0}=useQuery({queryKey:["live-web-processing"],queryFn:()=>fetchProcessing(),staleTime:0,refetchOnWindowFocus:true,refetchInterval:15000});const {data:confirmedToday=0}=useQuery({queryKey:["live-web-confirmed"],queryFn:()=>fetchConfirmed(),staleTime:0,refetchOnWindowFocus:true,refetchInterval:15000});', 1)
          s = s.replace('qc.invalidateQueries({queryKey:["live-web-processing"],refetchType:"active"});', 'qc.invalidateQueries({queryKey:["live-web-processing"],refetchType:"active"});qc.invalidateQueries({queryKey:["live-web-confirmed"],refetchType:"active"});', 1)
          pattern = re.compile(r'function TodayVisitorsCard\(\{today,processing\}:\{today:number;processing:number\}\)\{.*?\nfunction ConfirmedSalesProfitCard', re.S)
          replacement = '''function TodayVisitorsCard({today,processing,confirmed}:{today:number;processing:number;confirmed:number}){return <div className="group flex h-full min-h-[176px] min-w-0 flex-col rounded-2xl border border-sky-200 bg-white p-4 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:scale-[1.01] hover:shadow-2xl"><div className="grid h-full grid-cols-3 gap-2"><div className="flex min-w-0 items-start gap-2.5"><div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-sky-50"><Users className="h-5 w-5 text-sky-600"/></div><div className="min-w-0"><div className="text-[10px] font-bold text-slate-500">আজকের ভিজিটর</div><div className="mt-0.5 text-2xl font-black text-slate-900">{enDigits(today)}</div><div className="mt-1 text-[9px] leading-relaxed text-slate-400">Home + landing pages</div></div></div><div className="rounded-xl border border-amber-100 bg-amber-50/70 p-2.5"><div className="flex items-center justify-between gap-1"><div><div className="text-[9px] font-black text-amber-700">Total Processing</div><div className="mt-1 text-2xl font-black text-slate-900">{enDigits(processing)}</div><div className="mt-1 text-[8px] leading-relaxed text-amber-700/70">Web Pending / Processing</div></div><Clock3 className="h-4 w-4 shrink-0 text-amber-600"/></div><div className="mt-2 flex items-center gap-1 text-[7px] font-bold text-emerald-600"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-emerald-500"/>LIVE</div></div><div className="rounded-xl border border-emerald-100 bg-emerald-50/70 p-2.5"><div className="flex items-center justify-between gap-1"><div><div className="text-[9px] font-black text-emerald-700">Confirmed Today</div><div className="mt-1 text-2xl font-black text-slate-900">{enDigits(confirmed)}</div><div className="mt-1 text-[8px] leading-relaxed text-emerald-700/70">Employee confirmed web orders</div></div><CheckCircle2 className="h-4 w-4 shrink-0 text-emerald-600"/></div><div className="mt-2 flex items-center gap-1 text-[7px] font-bold text-emerald-600"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-emerald-500"/>LIVE</div></div></div></div>}
function ConfirmedSalesProfitCard'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('TodayVisitorsCard block not found; refusing to modify')
          s = s2
          s = s.replace('<TodayVisitorsCard today={Number(r.todayVisitors??0)} processing={Number(processingCount??0)}/>', '<TodayVisitorsCard today={Number(r.todayVisitors??0)} processing={Number(processingCount??0)} confirmed={Number(confirmedToday??0)}/>')
          p.write_text(s)

      - name: Verify build
        run: |
          npm install -g bun@1.2.15
          bun install --frozen-lockfile
          bun run build

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-dashboard-confirmed-metric.yml
          git add src/lib/dashboard-optimized.functions.ts src/lib/admin-order.functions.ts src/components/admin/PremiumDashboard.tsx
          git commit -m 'feat: dashboard today confirmed metric'
          git push
