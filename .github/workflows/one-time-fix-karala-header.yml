name: One-time fix Karala landing header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Karala header behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/landing.$slug.tsx')
          s = p.read_text()
          if 'body:has(.lp-hdr-timer) div:has(> .lp-hdr-timer)' not in s:
              old = '''const karalaCompactCss = `\nhtml, body { scroll-padding-top:0 !important; }\nbody { padding-top:0 !important; }\nheader { display:none !important; height:0 !important; min-height:0 !important; margin:0 !important; padding:0 !important; }\nmain { padding-top:0 !important; margin-top:0 !important; }\nmain > div:first-child { margin-top:0 !important; padding-top:0 !important; }\n`;'''
              new = '''const karalaCompactCss = `\nhtml, body { scroll-padding-top:0 !important; }\nbody { padding-top:0 !important; }\nbody:has(.lp-hdr-timer) header,\nbody:has(.lp-hdr-timer) [class*="sticky"]:has(.lp-hdr-timer),\nbody:has(.lp-hdr-timer) [class*="fixed"]:has(.lp-hdr-timer),\nbody:has(.lp-hdr-timer) div:has(> .lp-hdr-timer) { display:none !important; height:0 !important; min-height:0 !important; max-height:0 !important; margin:0 !important; padding:0 !important; border:0 !important; overflow:hidden !important; }\nheader { display:none !important; height:0 !important; min-height:0 !important; margin:0 !important; padding:0 !important; }\nmain { padding-top:0 !important; margin-top:0 !important; }\nmain > div:first-child { margin-top:0 !important; padding-top:0 !important; }\n.lp-root { padding-top:0 !important; margin-top:0 !important; }\n`;'''
              if old not in s:
                  raise SystemExit('Expected Karala CSS block not found')
              s = s.replace(old, new, 1)
          old_fn = '''    const hideLandingHeader = () => { if (!hideHeader) return; const header = document.querySelector("header") as HTMLElement | null; if (header) header.style.display = "none"; };'''
          new_fn = '''    const hideLandingHeader = () => {\n      if (!hideHeader) return;\n      const hide = (el: HTMLElement | null) => { if (!el) return; el.style.setProperty("display", "none", "important"); el.style.setProperty("height", "0", "important"); el.style.setProperty("min-height", "0", "important"); el.style.setProperty("margin", "0", "important"); el.style.setProperty("padding", "0", "important"); el.style.setProperty("overflow", "hidden", "important"); };\n      document.querySelectorAll("header").forEach(el => hide(el as HTMLElement));\n      for (const timerEl of Array.from(document.querySelectorAll(".lp-hdr-timer"))) {\n        let node = timerEl.parentElement as HTMLElement | null;\n        for (let depth = 0; node && depth < 6; depth++, node = node.parentElement) {\n          if (node.querySelector("img")) { hide(node); break; }\n        }\n      }\n      document.querySelectorAll('[class*="sticky"]').forEach(el => { if ((el as HTMLElement).querySelector(".lp-hdr-timer")) hide(el as HTMLElement); });\n    };'''
          if old_fn not in s:
              raise SystemExit('Expected hideLandingHeader function not found')
          s = s.replace(old_fn, new_fn, 1)
          p.write_text(s)
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-fix-karala-header.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/landing.\$slug.tsx .github/workflows/one-time-fix-karala-header.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Karala landing header removal'
          git push