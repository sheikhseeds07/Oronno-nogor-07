name: Apply Meta CAPI live repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-meta-capi-live-repair.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Meta CAPI migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          from pathlib import Path
          sql = Path('supabase/migrations/20260826051500_meta_capi_live_repair.sql').read_text()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=90) as response:
              print('Migration response:', response.status)
          PYCODE
      - name: Verify status function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': 'select public.get_meta_capi_status() as status'}).encode(),
              headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read().decode()
              print('Verification:', body)
              if 'server_events_ready' not in body:
                  raise SystemExit('Status function verification failed')
          PYCODE
