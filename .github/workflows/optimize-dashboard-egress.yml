name: Optimize Dashboard Egress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-dashboard-egress.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify optimized dashboard build
        shell: bash
        run: |
          if [ -f bun.lockb ] || [ -f bun.lock ]; then
            corepack enable || true
            bun install --frozen-lockfile
            bun run build
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f package-lock.json ]; then
            npm ci
            npm run build
          else
            npm install
            npm run build
          fi
