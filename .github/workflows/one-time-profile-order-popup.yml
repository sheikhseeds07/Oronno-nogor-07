name: one-time-profile-order-popup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-profile-order-popup.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'feat: add premium profile order popup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile order UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/profile.tsx')
          s = p.read_text()
          s = s.replace('import { createFileRoute, Link, useNavigate } from "@tanstack/react-router";', 'import { createFileRoute, useNavigate } from "@tanstack/react-router";')
          s = s.replace('Camera, ImagePlus, Loader2, Pencil, Save, X, ShoppingBag, Star, MessageSquareWarning, Phone, ShieldCheck, ChevronRight, LogOut', 'Camera, ImagePlus, Loader2, Pencil, Save, X, ShoppingBag, Star, MessageSquareWarning, Phone, ShieldCheck, ChevronRight, LogOut, Package, MapPin, Clock3, Truck, CheckCircle2')
          s = s.replace('  const [complaintSaving, setComplaintSaving] = useState(false);', '  const [complaintSaving, setComplaintSaving] = useState(false);\n  const [selectedOrderId, setSelectedOrderId] = useState<string | null>(null);')
          s = s.replace('    enabled: !!user && !!profile?.phone,', '    enabled: !!user,')
          marker = '''  const reviewsQ = useQuery({'''
          detail = '''  const orderDetailQ = useQuery({\n    queryKey: ["my-order-detail", user?.id, selectedOrderId],\n    enabled: !!user && !!selectedOrderId,\n    queryFn: async () => {\n      const { data, error } = await (supabase as any).rpc("get_my_customer_order_detail", { p_order_id: selectedOrderId });\n      if (error) throw error;\n      return data ?? null;\n    },\n  });\n\n'''
          if 'queryKey: ["my-order-detail"' not in s:
              s = s.replace(marker, detail + marker)
          s = s.replace('  const complaints = complaintsQ.data ?? [];', '  const complaints = complaintsQ.data ?? [];\n  const orderDetail = orderDetailQ.data;\n  const closeOrder = () => setSelectedOrderId(null);\n  const steps = ["pending", "confirmed", "processing", "shipped", "delivered"];\n  const currentStep = orderDetail ? steps.indexOf(orderDetail.status) : -1;\n  const isCancelled = orderDetail?.status === "cancelled";')
          old = '''{orders.map((o: any) => <Link key={o.id} to="/order/$id" params={{ id: o.id }} className="group block p-3 transition hover:bg-brand-light/20 sm:p-4"><div className="flex items-center justify-between gap-2"><div><div className="text-sm font-black">অর্ডার #{String(o.invoice_no || o.id).slice(-8).toUpperCase()}</div><div className="mt-0.5 text-[10px] text-muted-foreground">{format(new Date(o.created_at), "dd MMM yyyy, hh:mm a")}</div></div><div className="flex items-center gap-1.5"><span className="rounded-full bg-brand-light px-2 py-1 text-[10px] font-black text-brand-dark">{statusBn[o.status] || o.status}</span><ChevronRight className="h-4 w-4 text-muted-foreground transition group-hover:translate-x-0.5" /></div></div><div className="mt-2 flex items-center justify-between text-xs"><span className="text-muted-foreground">{o.customer_name || "আপনার অর্ডার"}</span><strong className="text-brand-dark">{taka(Number(o.total || 0))}</strong></div></Link>)}'''
          new = '''{orders.map((o: any) => <button type="button" key={o.id} onClick={() => setSelectedOrderId(o.id)} className="group block w-full p-3 text-left transition hover:bg-brand-light/20 sm:p-4"><div className="flex items-center justify-between gap-2"><div><div className="text-sm font-black">অর্ডার #{String(o.invoice_no || o.id).slice(-8).toUpperCase()}</div><div className="mt-0.5 text-[10px] text-muted-foreground">{format(new Date(o.created_at), "dd MMM yyyy, hh:mm a")}</div></div><div className="flex items-center gap-1.5"><span className="rounded-full bg-brand-light px-2 py-1 text-[10px] font-black text-brand-dark">{statusBn[o.status] || o.status}</span><ChevronRight className="h-4 w-4 text-muted-foreground transition group-hover:translate-x-0.5" /></div></div><div className="mt-2 flex items-center justify-between text-xs"><span className="text-muted-foreground">{o.customer_name || "আপনার অর্ডার"}</span><strong className="text-brand-dark">{taka(Number(o.total || 0))}</strong></div></button>)}'''
          if old not in s:
              raise SystemExit('order row pattern not found')
          s = s.replace(old, new)
          modal = '''\n      {selectedOrderId && <div className="fixed inset-0 z-[100] flex items-end justify-center bg-black/55 p-0 backdrop-blur-sm animate-in fade-in duration-200 sm:items-center sm:p-4" onMouseDown={e => { if (e.target === e.currentTarget) closeOrder(); }}>\n        <div className="relative max-h-[92vh] w-full max-w-2xl overflow-hidden rounded-t-[28px] border border-white/20 bg-background shadow-[0_30px_100px_rgba(0,0,0,.35)] animate-in slide-in-from-bottom-8 duration-300 sm:rounded-[28px] sm:slide-in-from-bottom-3">\n          <div className="absolute inset-x-0 top-0 h-24 bg-gradient-to-br from-brand/20 via-brand-light/20 to-transparent pointer-events-none" />\n          <div className="relative flex items-center justify-between border-b px-4 py-3.5 sm:px-6"><div><div className="flex items-center gap-2 text-sm font-black"><span className="flex h-8 w-8 items-center justify-center rounded-xl bg-brand text-white shadow-lg shadow-brand/20"><Package className="h-4 w-4" /></span>অর্ডারের বিস্তারিত</div><p className="mt-0.5 text-[10px] text-muted-foreground">আপনার অর্ডারের সম্পূর্ণ তথ্য</p></div><button onClick={closeOrder} className="flex h-9 w-9 items-center justify-center rounded-full border bg-background/80 transition hover:rotate-90 hover:border-brand hover:text-brand"><X className="h-4 w-4" /></button></div>\n          {orderDetailQ.isLoading ? <div className="flex min-h-[300px] items-center justify-center"><BrandLoader /></div> : orderDetailQ.isError || !orderDetail ? <div className="p-10 text-center"><div className="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-500"><X className="h-5 w-5" /></div><p className="mt-3 text-sm font-black">অর্ডারের তথ্য লোড করা যায়নি</p><button onClick={() => orderDetailQ.refetch()} className="mt-4 rounded-xl bg-brand px-4 py-2.5 text-xs font-black text-white">আবার চেষ্টা করুন</button></div> : <div className="max-h-[calc(92vh-72px)] overflow-y-auto p-4 sm:p-6">\n            <div className="rounded-2xl border bg-gradient-to-br from-brand-light/55 via-background to-background p-4 shadow-sm"><div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-[10px] font-bold uppercase tracking-[.16em] text-muted-foreground">ORDER ID</p><h3 className="mt-1 text-xl font-black tracking-tight">#{String(orderDetail.invoice_no || orderDetail.id).slice(-8).toUpperCase()}</h3><p className="mt-1 flex items-center gap-1 text-[10px] text-muted-foreground"><Clock3 className="h-3 w-3" />{format(new Date(orderDetail.created_at), "dd MMM yyyy, hh:mm a")}</p></div><span className={`inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[10px] font-black ${isCancelled ? "bg-red-100 text-red-700" : "bg-brand text-white shadow-md shadow-brand/20"}`}><CheckCircle2 className="h-3.5 w-3.5" />{statusBn[orderDetail.status] || orderDetail.status}</span></div></div>\n            <div className="mt-4 rounded-2xl border bg-background p-4"><div className="flex items-center justify-between"><div><p className="text-[11px] font-black">অর্ডার স্ট্যাটাস</p><p className="mt-0.5 text-[10px] text-muted-foreground">আপনার অর্ডার এখন কোথায় আছে</p></div><Truck className="h-5 w-5 text-brand" /></div>{isCancelled ? <div className="mt-4 rounded-xl bg-red-50 p-3 text-xs font-bold text-red-700">এই অর্ডারটি বাতিল করা হয়েছে।</div> : <><div className="mt-5 flex items-start">{steps.map((step, i) => { const done = currentStep >= i; return <div key={step} className="relative flex flex-1 flex-col items-center text-center"><div className={`relative z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 bg-background transition-all duration-500 ${done ? "border-brand bg-brand text-white shadow-lg shadow-brand/20 scale-105" : "border-muted text-muted-foreground"}`}>{done ? <CheckCircle2 className="h-4 w-4" /> : <span className="text-[9px] font-black">{i + 1}</span>}</div>{i < steps.length - 1 && <div className={`absolute left-1/2 top-4 h-0.5 w-full transition-all duration-700 ${currentStep > i ? "bg-brand" : "bg-muted"}`} />}</div>; })}</div><div className="mt-1 grid grid-cols-5 text-center text-[8px] font-bold text-muted-foreground"><span>অর্ডার</span><span>কনফার্ম</span><span>প্রস্তুত</span><span>ডেলিভারি</span><span>সম্পন্ন</span></div></>}</div>\n            <div className="mt-4"><div className="mb-2 flex items-center justify-between"><h3 className="text-sm font-black">অর্ডার করা পণ্য</h3><span className="rounded-full bg-muted px-2 py-1 text-[9px] font-black">{orderDetail.order_items?.length || 0} টি</span></div><div className="overflow-hidden rounded-2xl border">{orderDetail.order_items?.length ? orderDetail.order_items.map((item: any) => <div key={item.id} className="flex items-center justify-between gap-3 border-b p-3 last:border-b-0"><div className="min-w-0"><p className="truncate text-xs font-black">{item.product_name}</p><p className="mt-0.5 text-[10px] text-muted-foreground">{taka(Number(item.price || 0))} × {item.quantity}</p></div><strong className="shrink-0 text-xs text-brand-dark">{taka(Number(item.subtotal || 0))}</strong></div>) : <div className="p-4 text-center text-xs text-muted-foreground">পণ্যের তথ্য পাওয়া যায়নি।</div>}</div></div>\n            <div className="mt-4 grid gap-3 sm:grid-cols-2"><div className="rounded-2xl border p-3"><p className="text-[10px] font-black text-muted-foreground">ডেলিভারি তথ্য</p><div className="mt-2 space-y-1.5 text-xs"><div className="font-black">{orderDetail.customer_name}</div><div className="flex items-start gap-1.5 text-muted-foreground"><Phone className="mt-0.5 h-3.5 w-3.5 shrink-0 text-brand" />{orderDetail.customer_phone}</div><div className="flex items-start gap-1.5 text-muted-foreground"><MapPin className="mt-0.5 h-3.5 w-3.5 shrink-0 text-brand" /><span>{[orderDetail.customer_address, orderDetail.thana, orderDetail.district].filter(Boolean).join(", ") || "ঠিকানা দেওয়া নেই"}</span></div></div></div><div className="rounded-2xl border p-3"><p className="text-[10px] font-black text-muted-foreground">অর্ডার মোট</p><div className="mt-2 space-y-1.5 text-xs"><div className="flex justify-between"><span className="text-muted-foreground">সাবটোটাল</span><span>{taka(Number(orderDetail.subtotal || 0))}</span></div><div className="flex justify-between"><span className="text-muted-foreground">ডেলিভারি চার্জ</span><span>{taka(Number(orderDetail.delivery_fee || 0))}</span></div><div className="my-1 border-t" /><div className="flex justify-between text-sm font-black"><span>সর্বমোট</span><span className="text-brand-dark">{taka(Number(orderDetail.total || 0))}</span></div></div></div></div>\n            {(orderDetail.courier_display_name || orderDetail.courier_consignment) && <div className="mt-4 rounded-2xl bg-brand-light/45 p-3"><div className="flex items-center gap-2"><Truck className="h-4 w-4 text-brand" /><div><p className="text-xs font-black">কুরিয়ার তথ্য</p><p className="text-[10px] text-muted-foreground">{orderDetail.courier_display_name || "কুরিয়ার"}{orderDetail.courier_consignment ? ` • ${orderDetail.courier_consignment}` : ""}</p></div></div></div>}\n          </div>}\n        </div>\n      </div>}\n'''
          if 'fixed inset-0 z-[100]' not in s:
              s = s.replace('          <button onClick={logout}', modal + '          <button onClick={logout}')
          p.write_text(s)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "lovable-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/routes/profile.tsx .github/workflows/one-time-profile-order-popup.yml
          git rm .github/workflows/one-time-profile-order-popup.yml
          git commit -m "feat: add premium profile order popup"
          git push
