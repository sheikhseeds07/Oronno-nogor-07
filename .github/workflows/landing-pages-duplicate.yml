name: Add landing page duplicate action

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  duplicate-feature:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build baseline
        run: bun run build

      - name: Add duplicate action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/landing-pages.tsx')
          s = p.read_text()

          old_import = 'import { Plus, Trash2, ExternalLink, Edit, X, PackagePlus } from "lucide-react";'
          new_import = 'import { Plus, Trash2, ExternalLink, Edit, X, PackagePlus, Copy } from "lucide-react";'
          if old_import not in s:
              raise SystemExit('Expected lucide import not found; refusing unsafe edit')
          s = s.replace(old_import, new_import, 1)

          old_remove = '''  const remove = async (id: string) => {\n    if (!confirm("ডিলিট?")) return;\n    await supabase.from("landing_pages").delete().eq("id", id);\n    qc.invalidateQueries({ queryKey: ["admin-landing"] });\n  };'''
          new_remove = '''  const remove = async (id: string) => {\n    if (!confirm("ডিলিট?")) return;\n    await supabase.from("landing_pages").delete().eq("id", id);\n    qc.invalidateQueries({ queryKey: ["admin-landing"] });\n  };\n\n  const duplicateLandingPage = async (row: LP) => {\n    if (!row.id) return toast.error("ল্যান্ডিং পেজের ID পাওয়া যায়নি");\n    const suffix = Date.now().toString(36);\n    const source = { ...row } as Record<string, unknown>;\n    delete source.id;\n    delete source.created_at;\n    delete source.updated_at;\n    const baseSlug = (row.slug || "landing-page").replace(/-copy(?:-[a-z0-9]+)?$/i, "");\n    const payload = {\n      ...source,\n      title: `${row.title || "Landing page"} (কপি)`,\n      slug: `${baseSlug}-copy-${suffix}`,\n      is_published: false,\n    };\n    const { data: created, error } = await supabase\n      .from("landing_pages")\n      .insert(payload)\n      .select("*")\n      .single();\n    if (error) return toast.error(`ডুপ্লিকেট তৈরি হয়নি: ${error.message}`);\n    toast.success("ল্যান্ডিং পেজ ডুপ্লিকেট হয়েছে — এখন এডিট করুন");\n    qc.invalidateQueries({ queryKey: ["admin-landing"] });\n    if (created) openEdit(created);\n  };'''
          if old_remove not in s:
              raise SystemExit('Expected remove handler not found; refusing unsafe edit')
          s = s.replace(old_remove, new_remove, 1)

          old_button = '''                <button onClick={() => openEdit(p)} className="flex-1 p-1.5 hover:bg-muted rounded text-xs">\n                  <Edit className="w-3.5 h-3.5 inline" /> এডিট\n                </button>\n                <button onClick={() => remove(p.id)} className="p-1.5 hover:bg-destructive/10 text-destructive rounded">'''
          new_button = '''                <button onClick={() => openEdit(p)} className="flex-1 p-1.5 hover:bg-muted rounded text-xs">\n                  <Edit className="w-3.5 h-3.5 inline" /> এডিট\n                </button>\n                <button onClick={() => duplicateLandingPage(p)} className="flex-1 p-1.5 hover:bg-green-50 text-green-700 rounded text-xs" title="ডুপ্লিকেট">\n                  <Copy className="w-3.5 h-3.5 inline" /> ডুপ্লিকেট\n                </button>\n                <button onClick={() => remove(p.id)} className="p-1.5 hover:bg-destructive/10 text-destructive rounded">'''
          if old_button not in s:
              raise SystemExit('Expected action buttons not found; refusing unsafe edit')
          s = s.replace(old_button, new_button, 1)
          p.write_text(s)
          PY

      - name: Build after change
        run: bun run build

      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/landing-pages.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add landing page duplicate action [skip ci]'
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/landing-pages-duplicate.yml
          git commit -m 'Remove temporary landing duplicate workflow [skip ci]'
          git push origin main
