name: Community UI final fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch community UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/components/community/SocialFeedProV2.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('community-composer border-b bg-background px-3 py-2.5', 'border-b bg-background px-3 py-2.5', 1)
          s=s.replace('<section className="border-b bg-background px-3 py-2 sm:mt-2 sm:rounded-2xl sm:border">', '<section className="community-composer border-b bg-background px-3 py-2 sm:mt-2 sm:rounded-2xl sm:border">', 1)
          s=s.replace('<input value={postTitle} onChange={e=>setPostTitle(e.target.value)} placeholder="কিছু লিখতে চাইলে লিখুন..." className="min-w-0 flex-1 rounded-xl bg-muted px-3 py-2 text-xs font-medium outline-none"/>', '<input value={postTitle} onChange={e=>setPostTitle(e.target.value)} type="hidden"/>', 1)
          old_style='[placeholder="SHAWON, আজ কী শেয়ার করবেন?"]{display:none!important}.community-composer{display:flex;align-items:center;gap:8px}.community-composer textarea,.community-composer input{min-width:0}.community-composer .mt-1\\.5{margin-top:0!important}.community-composer .mt-1\\.5{display:flex!important;align-items:center!important;gap:6px!important;flex:1!important}.community-composer .mt-1\\.5>*{flex-shrink:0}.community-composer .mt-1\\.5 input{flex:1!important}.community-composer button{white-space:nowrap}'
          new_style='.community-composer{display:flex!important;align-items:center!important;gap:8px!important}.community-composer>div:first-child{display:contents!important}.community-composer>div:nth-child(2){display:flex!important;align-items:center!important;gap:6px!important;flex:1!important;margin-top:0!important}.community-composer>div:nth-child(2)>input:not([type="hidden"]){min-width:0!important;flex:1!important}.community-composer>div:nth-child(2)>button{flex-shrink:0!important;white-space:nowrap!important}.community-composer>div:nth-child(3){flex-basis:100%!important}.community-composer button{white-space:nowrap!important}'
          s=s.replace(old_style,new_style,1)
          s=s.replace("{mine?R.find(x=>x[0]===mine)?.[1]:'👍'} রিয়েক্ট", "{mine?R.find(x=>x[0]===mine)?.[1]:''} রিয়েক্ট", 1)
          s=s.replace("onClick={()=>setReaction(reaction===p.id?null:p.id)}", "onClick={()=>{if(mine)void react(p,mine);else setReaction(reaction===p.id?null:p.id)}}", 1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/community/SocialFeedProV2.tsx
          git rm -f .github/workflows/community-ui-final.yml
          git commit -m 'fix: finalize compact community composer'
          git push origin HEAD:main
          # one-shot workflow; its bot push is intentionally skipped by the job condition
