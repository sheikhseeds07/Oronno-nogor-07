name: Fix creatorMap crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix OrdersTableRows creatorMap destructuring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = '''function OrdersTableRows({\n  orders, loading, mode, onOpen, empty,\n  selectedIds, onToggleOne, onToggleAll, allChecked,\n  lockMap, currentUserId,\n}: {'''
          new = '''function OrdersTableRows({\n  orders, loading, mode, onOpen, empty,\n  selectedIds, onToggleOne, onToggleAll, allChecked,\n  lockMap, currentUserId, creatorMap,\n}: {'''
          if old not in s:
              raise SystemExit('Expected OrdersTableRows signature not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-creator-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx .github/workflows/fix-creator-map.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore creatorMap in order list rows"
          git push