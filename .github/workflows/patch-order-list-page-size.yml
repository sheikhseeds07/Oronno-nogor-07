name: Patch Order List page size
on:
  push:
    branches: [agent/order-list-page-size]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[order-list-page-size-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch exact pagination code
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          marker = 'const LIST_STATUSES: OrderStatus[] = ['
          constants = '''const ORDER_LIST_PAGE_SIZE_KEY = "order-list-page-size";
          const ORDER_LIST_PAGE_SIZES = [20, 50, 70, 100, 200, 500] as const;
          type OrderListPageSize = (typeof ORDER_LIST_PAGE_SIZES)[number];
          
          '''
          if 'ORDER_LIST_PAGE_SIZE_KEY' not in s:
              assert marker in s
              s = s.replace(marker, constants + marker, 1)
          old = 'const [rtsPageSize, setRtsPageSize] = useState<20 | 50 | 100>(50);'
          new = '''const [rtsPageSize, setRtsPageSize] = useState<OrderListPageSize>(() => {
            if (typeof window === "undefined") return 50;
            const saved = Number(window.localStorage.getItem(ORDER_LIST_PAGE_SIZE_KEY));
            return ORDER_LIST_PAGE_SIZES.includes(saved as OrderListPageSize)
              ? (saved as OrderListPageSize)
              : 50;
          });
          useEffect(() => {
            if (typeof window !== "undefined") {
              window.localStorage.setItem(ORDER_LIST_PAGE_SIZE_KEY, String(rtsPageSize));
            }
          }, [rtsPageSize]);'''
          assert old in s, 'page size state not found'
          s = s.replace(old, new, 1)
          old_select = '<select value={rtsPageSize} onChange={(e) => setRtsPageSize(Number(e.target.value) as 20 | 50 | 100)} className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-brand/30"><option value={20}>20</option><option value={50}>50</option><option value={100}>100</option></select>'
          new_select = '<select value={rtsPageSize} onChange={(e) => setRtsPageSize(Number(e.target.value) as OrderListPageSize)} className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-brand/30"><option value={20}>20</option><option value={50}>50</option><option value={70}>70</option><option value={100}>100</option><option value={200}>200</option><option value={500}>500</option></select>'
          assert old_select in s, 'page size selector not found'
          s = s.replace(old_select, new_select, 1)
          assert s != original
          p.write_text(s, encoding='utf-8')
      - name: Build and verify
        run: |
          bun install --frozen-lockfile
          bun run build
          git diff --check
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git rm .github/workflows/patch-order-list-page-size.yml
          git commit -m "fix: persist Order List page size [order-list-page-size-final]"
          git push