name: Fix popup CTA behavior
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - name: Remove popup CTA scroll
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'onClick={() => { closeGuaranteePopup(); goOrder(); }}'
          new = 'onClick={closeGuaranteePopup}'
          if old not in s:
              raise SystemExit('Expected popup CTA handler not found; refusing unsafe edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Production build
        run: bun run build
      - name: Commit and push only after successful build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx
          git commit -m 'fix: close popup CTA without scrolling to checkout'
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-popup-cta-behavior.yml
          git commit -m 'chore: remove temporary popup CTA fix workflow'
          git push origin main
