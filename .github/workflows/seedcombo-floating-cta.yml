name: SeedCombo floating CTA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/landing/ProductStyleLandingPage.tsx')
          s=p.read_text()
          old='''{checkoutVisible && <button type="button" onClick={() => submit()} disabled={submitting} aria-label="অর্ডার টি কনফার্ম করুন" className="hng-floating-order fixed bottom-0 left-1/2 z-50 w-[min(92vw,430px)] rounded-t-2xl rounded-b-none px-5 py-3.5 text-white font-black text-base border border-white/25 border-b-0 backdrop-blur-md transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-70" style={{ backgroundColor: theme }}><span className="relative z-10 inline-flex items-center justify-center gap-2"><span className="inline-block h-2 w-2 rounded-full bg-white shadow-[0_0_0_4px_rgba(255,255,255,.15)]" />{submitting ? "অর্ডার হচ্ছে..." : `অর্ডার টি কনফার্ম করুন — ${taka(total)}`}</span></button>}'''
          new='''{checkoutVisible && <button type="button" onClick={() => submit()} disabled={submitting} aria-label="অর্ডার কনফার্ম করুন" className="hng-floating-order fixed bottom-0 left-1/2 z-50 w-[min(92vw,430px)] rounded-t-2xl rounded-b-none px-5 py-3.5 text-white font-black text-base border border-white/25 border-b-0 backdrop-blur-md transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-70" style={{ backgroundColor: slug === "seedcombo" ? "#166534" : theme }}><span className="relative z-10 inline-flex items-center justify-center gap-2">{submitting ? "অর্ডার হচ্ছে..." : slug === "seedcombo" ? "অর্ডার কনফার্ম করুন - ৳২৯৯" : `অর্ডার টি কনফার্ম করুন — ${taka(total)}`}</span></button>}'''
          if old not in s: raise SystemExit('CTA source not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/seedcombo-floating-cta.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx .github/workflows/seedcombo-floating-cta.yml
          git commit -m 'fix(landing): simplify SeedCombo floating checkout CTA [skip ci]'
          git push
