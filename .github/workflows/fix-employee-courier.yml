name: Fix employee courier sending
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-employee-courier.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch courier employee access and RTS config loading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          orders = Path('src/routes/admin/orders.tsx')
          s = orders.read_text()

          if 'const { isAdmin, isStaff } = useAuth();' not in s:
              anchor = 'function OrdersTable({\n'
              if anchor not in s:
                  raise SystemExit('OrdersTable anchor not found')
              pos = s.index(anchor)
              body_start = s.index('{', pos)
              insert_at = s.index('\n', body_start) + 1
              s = s[:insert_at] + '  const { isAdmin, isStaff } = useAuth();\n' + s[insert_at:]

          s = re.sub(r'\{isAdmin && (?=(?:.|\n){0,900}?(?:পাঠান|sendBulk|Courier|কুরিয়ার))', '{isStaff && ', s)

          old_import = 'import { sendOrdersToSteadfast, syncSteadfastStatuses } from "@/lib/courier-test.functions";'
          new_import = 'import { sendOrdersToSteadfast, syncSteadfastStatuses, getSteadfastDisplayNames } from "@/lib/courier-test.functions";'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)

          old = '''  useEffect(() => {\n    let alive = true;\n    (async () => {\n      const { data } = await supabase.from("integrations").select("name,config").in("name", ["all_api_steadfast", "all_api_steadfast_2"]);'''
          if old in s:
              new = '''  const loadCourierDisplayNames = useServerFn(getSteadfastDisplayNames);\n  useEffect(() => {\n    let alive = true;\n    (async () => {\n      const { names } = await loadCourierDisplayNames();'''
              s = s.replace(old, new, 1)
              s = s.replace('''      const map: Record<1 | 2, string> = { 1: "কুরিয়ার ১", 2: "কুরিয়ার ২" };\n      for (const r of data ?? []) {\n        const c = (r.config ?? {}) as Record<string, unknown>;\n        const name = typeof c.display_name === "string" ? c.display_name.trim() : "";\n        if (r.name === "all_api_steadfast" && name) map[1] = name;\n        if (r.name === "all_api_steadfast_2" && name) map[2] = name;\n      }''', '''      const map: Record<1 | 2, string> = { 1: names?.[1] || "কুরিয়ার ১", 2: names?.[2] || "কুরিয়ার ২" };''', 1)
              s = s.replace('''    })();\n    return () => { alive = false; };\n  }, []);''', '''    })();\n    return () => { alive = false; };\n  }, [loadCourierDisplayNames]);''', 1)

          orders.write_text(s)

          courier = Path('src/lib/courier-test.functions.ts')
          c = courier.read_text()
          if 'export const getSteadfastDisplayNames' not in c:
              marker = 'export const sendOrdersToSteadfast = createServerFn({ method: "POST" })'
              if marker not in c:
                  raise SystemExit('courier server function anchor not found')
              fn = '''export const getSteadfastDisplayNames = createServerFn({ method: "GET" })\n  .middleware([requireSupabaseAuth])\n  .handler(async ({ context }) => {\n    await assertCanManageOrders(context.userId);\n    const { data: rows } = await supabaseAdmin\n      .from("integrations")\n      .select("name,config,is_active")\n      .in("name", ["all_api_steadfast", "all_api_steadfast_2", "courier_steadfast"]);\n    const active = (rows ?? []).filter((r) => r.is_active);\n    const one = active.find((r) => r.name === "all_api_steadfast") ?? active.find((r) => r.name === "courier_steadfast") ?? active[0];\n    const two = active.find((r) => r.name === "all_api_steadfast_2");\n    const display = (row: any, fallback: string) => {\n      const cfg = (row?.config ?? {}) as Record<string, unknown>;\n      const value = typeof cfg.display_name === "string" ? cfg.display_name.trim() : "";\n      return value || fallback;\n    };\n    return { names: { 1: display(one, "কুরিয়ার ১"), 2: display(two, "কুরিয়ার ২") } };\n  });\n\n'''
              c = c.replace(marker, fn + marker, 1)
              courier.write_text(c)

          print('Patched employee courier access + server-side courier names')
          PY
          if git diff --quiet; then
            echo 'No changes needed'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx src/lib/courier-test.functions.ts
          git commit -m 'fix: allow employees to send courier orders and load RTS courier names'
          git push
