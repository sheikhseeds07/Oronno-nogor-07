name: Fix Web Order Labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[web-label-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested Web Order label changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          s2 = s.replace('web_pending: "Web Pending"', 'web_pending: "Processing"')
          if s2 == s:
              raise SystemExit('Expected Web Pending label was not found; refusing to modify the file.')
          p.write_text(s2)
          PY
          git diff -- src/routes/admin/orders.tsx
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git commit -m "Rename Web Pending to Processing [web-label-fix]"
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git rm .github/workflows/fix-web-order-labels.yml
          git commit -m "Remove temporary web label workflow [web-label-fix]"
          git push
