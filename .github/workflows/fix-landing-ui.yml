name: Fix landing page UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply landing page UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          admin = Path('src/routes/admin/landing-pages.tsx')
          if admin.exists():
              s = admin.read_text(encoding='utf-8')

              # Permanently remove the legacy Content-editor options.
              for label in ['অর্ডার — ছোট', 'অর্ডার — বড়']:
                  s = re.sub(r'\s*<Field label="' + re.escape(label) + r'">.*?</Field>\s*', '\n', s, count=1, flags=re.S)

              # Remove the legacy Order form heading and its editable note field,
              # while keeping all actual checkout/customer fields intact.
              s = re.sub(
                  r'\s*\{\/\* Order form \*\/\}\s*'
                  r'<div className="pt-3 border-t space-y-3">\s*'
                  r'<div className="font-semibold text-sm">অর্ডার ফর্ম</div>\s*'
                  r'<Field label="ফর্মের উপরের নোট">.*?</Field>\s*',
                  '\n                  {/* Checkout fields */}\n                  <div className="pt-3 border-t space-y-3">\n',
                  s, count=1, flags=re.S)
              admin.write_text(s, encoding='utf-8')

          # Remove legacy visible labels from landing-page JSX without touching
          # normal checkout inputs or order processing.
          for p in Path('src').rglob('*.tsx'):
              if 'landing' not in str(p).lower():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<([A-Za-z][A-Za-z0-9.]*)[^>]*>\s*ধাপ ২\s*</\1>', '', s)
              s = re.sub(r'<([A-Za-z][A-Za-z0-9.]*)[^>]*>\s*ডেলিভারি তথ্য দিন\s*</\1>', '', s)
              p.write_text(s, encoding='utf-8')

          # Make the product-selection and checkout area visually one continuous
          # bordered card on the clean landing page. This preserves all behavior.
          clean = Path('src/components/landing/CleanLandingPage.tsx')
          if clean.exists():
              s = clean.read_text(encoding='utf-8')
              marker = '        {/* Checkout */}\n        <section id="order" ref={orderSectionRef} className="scroll-mt-20">'
              if marker in s and 'lp-product-checkout-group' not in s:
                  s = s.replace(marker, '        {/* Checkout */}\n        <section id="order" ref={orderSectionRef} className="scroll-mt-20 lp-product-checkout-group">', 1)

              # Add the shared card class to the package selector's Reveal wrapper.
              s = s.replace('          <Reveal>\n            <SectionHead kicker={C.package_kicker} title={C.package_title} />', '          <Reveal className="lp-product-selector">\n            <SectionHead kicker={C.package_kicker} title={C.package_title} />', 1)

              # Shared border styling: selector + checkout visually touch as one card.
              if 'lp-product-checkout-group' in s and 'lp-product-checkout-group{' not in s:
                  style = '''\n\nconst LANDING_CHECKOUT_GROUP_STYLE = `\n.lp-product-checkout-group {\n  border: 1px solid rgb(226 232 240);\n  border-radius: 16px;\n  background: white;\n  overflow: hidden;\n}\n.lp-product-checkout-group .lp-product-selector {\n  padding: 16px;\n  margin: 0;\n  border-bottom: 1px solid rgb(226 232 240);\n}\n.lp-product-checkout-group > section {\n  padding: 16px;\n  margin: 0;\n}\n.lp-product-checkout-group .lp-product-selector > div,\n.lp-product-checkout-group > section > div {\n  margin-bottom: 0;\n}\n`;\n\n'''
                  anchor = 'const DEFAULT_ICONS = [Sprout, Leaf, ShieldCheck, Award, Wallet, Truck, Headphones, BarChart3];\n'
                  if anchor in s:
                      s = s.replace(anchor, anchor + style, 1)

              # Inject the style once at runtime without requiring another CSS file.
              inject = '      <style>{LANDING_CHECKOUT_GROUP_STYLE}</style>\n'
              if inject not in s:
                  s = s.replace('      <FacebookPixel eager />\n', '      <FacebookPixel eager />\n' + inject, 1)
              clean.write_text(s, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/fix-landing-ui.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: permanently remove legacy landing checkout UI"
          git push
