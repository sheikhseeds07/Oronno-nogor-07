name: Fix landing page UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply landing page UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          admin = Path('src/routes/admin/landing-pages.tsx')
          if admin.exists():
              s = admin.read_text(encoding='utf-8')
              for label in ['অর্ডার — ছোট', 'অর্ডার — বড়']:
                  s = re.sub(r'\s*<Field label="' + re.escape(label) + r'">.*?</Field>\s*', '\n', s, count=1, flags=re.S)
              s = re.sub(
                  r'\s*\{\/\* Order form \*\/\}\s*'
                  r'<div className="pt-3 border-t space-y-3">\s*'
                  r'<div className="font-semibold text-sm">অর্ডার ফর্ম</div>\s*'
                  r'<Field label="ফর্মের উপরের নোট">.*?</Field>\s*',
                  '\n                  {/* Checkout fields */}\n                  <div className="pt-3 border-t space-y-3">\n',
                  s, count=1, flags=re.S)
              admin.write_text(s, encoding='utf-8')

          # Remove the two legacy visible labels only from landing-page JSX.
          for p in Path('src').rglob('*.tsx'):
              if 'landing' not in str(p).lower():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<([A-Za-z][A-Za-z0-9.]*)[^>]*>\s*ধাপ ২\s*</\1>', '', s)
              s = re.sub(r'<([A-Za-z][A-Za-z0-9.]*)[^>]*>\s*ডেলিভারি তথ্য দিন\s*</\1>', '', s)
              p.write_text(s, encoding='utf-8')

          clean = Path('src/components/landing/CleanLandingPage.tsx')
          if clean.exists():
              s = clean.read_text(encoding='utf-8')

              # Give the package list a stable hook. Do not pass props to Reveal.
              s = s.replace(
                  '<SectionHead kicker={C.package_kicker} title={C.package_title} />\n            <div className="space-y-2">',
                  '<SectionHead kicker={C.package_kicker} title={C.package_title} />\n            <div className="space-y-2 lp-product-selector-list">',
                  1,
              )

              # Hook the checkout section without changing checkout behavior.
              s = s.replace(
                  '<section id="order" ref={orderSectionRef} className="scroll-mt-20">',
                  '<section id="order" ref={orderSectionRef} className="scroll-mt-20 lp-product-checkout-group">',
                  1,
              )

              style = '''\nconst LANDING_CHECKOUT_GROUP_STYLE = `\n/* Product selection + checkout = one continuous bordered card */\n.lp-product-checkout-group {\n  border: 1px solid rgb(226 232 240);\n  border-top: 0;\n  border-radius: 0 0 16px 16px;\n  background: white;\n  padding: 16px;\n  margin-top: -24px;\n}\n.lp-root .container.max-w-2xl.space-y-6 > *:has(.lp-product-selector-list) {\n  border: 1px solid rgb(226 232 240);\n  border-bottom: 0;\n  border-radius: 16px 16px 0 0;\n  background: white;\n  padding: 16px;\n  margin-bottom: 0;\n}\n.lp-product-checkout-group > div {\n  margin-bottom: 0;\n}\n`;\n\n'''
              if 'const LANDING_CHECKOUT_GROUP_STYLE' not in s:
                  anchor = 'const DEFAULT_ICONS = [Sprout, Leaf, ShieldCheck, Award, Wallet, Truck, Headphones, BarChart3];\n'
                  s = s.replace(anchor, anchor + style, 1)

              inject = '      <style>{LANDING_CHECKOUT_GROUP_STYLE}</style>\n'
              if inject not in s:
                  s = s.replace('      <FacebookPixel eager />\n', '      <FacebookPixel eager />\n' + inject, 1)

              clean.write_text(s, encoding='utf-8')

          # This is a one-shot migration; remove the helper workflow after it runs.
          Path('.github/workflows/fix-landing-ui.yml').unlink(missing_ok=True)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/fix-landing-ui.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: permanently remove legacy landing checkout UI"
          git push
