name: Fix SeedCombo Floating CTA
on:
  push:
    paths:
      - '.github/workflows/fix-seedcombo-floating-cta.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''{checkoutVisible && <button type="button" onClick={() => submit()} disabled={submitting} aria-label="অর্ডার টি কনফার্ম করুন" className="hng-floating-order fixed bottom-0 left-1/2 z-50 w-[min(92vw,430px)] rounded-t-2xl rounded-b-none px-5 py-3.5 text-white font-black text-base border border-white/25 border-b-0 backdrop-blur-md transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-70" style={{ backgroundColor: theme }}><span className="relative z-10 inline-flex items-center justify-center gap-2"><span className="inline-block h-2 w-2 rounded-full bg-white shadow-[0_0_0_4px_rgba(255,255,255,.15)]" />{submitting ? "অর্ডার হচ্ছে..." : `অর্ডার টি কনফার্ম করুন — ${taka(total)}`}</span></button>}'''
          new = '''{checkoutVisible && slug === "seedcombo" && <button type="button" onClick={() => submit()} disabled={submitting} aria-label="অর্ডার কনফার্ম করুন - ৳২৯৯" className="hng-floating-order fixed bottom-0 left-1/2 z-50 w-[min(92vw,430px)] rounded-t-2xl rounded-b-none px-5 py-3.5 text-white font-black text-base border border-white/25 border-b-0 transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-70" style={{ backgroundColor: "#166534" }}>{submitting ? "অর্ডার হচ্ছে..." : "অর্ডার কনফার্ম করুন - ৳২৯৯"}</button>}'''
          if old not in s:
              raise SystemExit('Target CTA markup not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx
          git commit -m 'fix: seedcombo floating order CTA' || exit 0
          git push
