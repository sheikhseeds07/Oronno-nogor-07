name: Apply seedcombo popup media fix

on:
  push:
    branches:
      - main
    paths:
      - .trigger-seedcombo-popup-media

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Apply focused patch
        run: python scripts/fix_seedcombo_popup.py
      - name: Verify build
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run build
      - name: Commit only popup fix and remove temporary files
        run: |
          rm -f .trigger-seedcombo-popup-media scripts/fix_seedcombo_popup.py .github/workflows/apply-seedcombo-popup-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/landing-content.ts src/components/landing/CleanLandingPage.tsx src/routes/admin/landing-pages.tsx .trigger-seedcombo-popup-media scripts/fix_seedcombo_popup.py .github/workflows/apply-seedcombo-popup-media.yml
          git commit -m "fix: restore seedcombo popup text and image controls"
          git push origin HEAD:main
