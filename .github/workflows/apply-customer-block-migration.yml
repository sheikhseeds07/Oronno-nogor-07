name: Apply customer block (phone + IP) migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-block-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply block migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          from pathlib import Path
          sql = Path('supabase/migrations/20260904000000_block_phone_and_site_block.sql').read_text()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              print('Migration response:', response.status)
          PYCODE
      - name: Verify block functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: bvuhvzccziuniujeogng
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          q = "select public.is_blocked_visitor('203.0.113.9','01700000000') as blocked, (select count(*) from public.customer_blocks) as rows"
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': q}).encode(),
              headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              body = response.read().decode()
              print('Verification:', body)
              if 'blocked' not in body:
                  raise SystemExit('Verification failed')
          PYCODE
