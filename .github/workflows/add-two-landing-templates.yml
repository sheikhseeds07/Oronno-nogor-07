name: Finish landing template admin selector
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Premium and Modern selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/landing-pages.tsx')
          s = p.read_text()
          old = '''                      {([[
                        "combo", "Combo", "ফানেল স্টাইল — প্রোমো স্ক্রল, গিফট, কাউন্টডাউন, পপআপ"
                      ]] as const).map(([val, label, hint]) => ('''
          new = '''                      {([[
                        ["combo", "Combo", "ফানেল স্টাইল — প্রোমো স্ক্রল, গিফট, কাউন্টডাউন, পপআপ"],
                        ["premium", "Premium Product", "প্রিমিয়াম প্রোডাক্ট শোকেস — clean, elegant ও trust-focused"],
                        ["modern", "Modern Sales", "মডার্ন conversion layout — bold hero, offer ও strong CTA"]
                      ] as const).map(([val, label, hint]) => ('''
          if old in s:
              s = s.replace(old, new)
              s = s.replace('onClick={() => setC({ template: val })}', 'onClick={() => setC({ template: val as LandingContent["template"] })}')
              p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/routes/admin/landing-pages.tsx
          git rm .github/workflows/add-two-landing-templates.yml
          git commit -m "Add Premium and Modern landing template selectors" || exit 0
          git push
