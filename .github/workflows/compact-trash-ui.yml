name: Apply Compact Trash UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only trash UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/admin/deleted-orders.tsx')
          text = path.read_text(encoding='utf-8')
          start_marker = '          {rows.map((row) => ('
          end_marker = '\n        ) : rows.length === 0 ?'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate trash order list UI markers')
          replacement = '''          {rows.map((row) => {
            const busy = busyId === row.id;
            const status = restoreTargets[row.id] ?? preferredStatus(row.original_status);
            return (
              <div key={row.id} className="group relative overflow-x-auto rounded-xl border border-slate-200/80 bg-white shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-brand/30 hover:shadow-lg">
                <div className="flex min-w-[760px] items-center gap-2.5 px-3 py-2.5 sm:px-4 sm:py-3">
                  <input type="checkbox" checked={selectedIds.has(row.id)} onChange={() => toggleOne(row.id)} disabled={bulkBusy || busy} className="h-4 w-4 shrink-0 accent-brand" />
                  <div className="w-[78px] shrink-0 font-extrabold text-slate-900">#{row.invoice_no ?? row.id.slice(0, 8).toUpperCase()}</div>
                  <span className="shrink-0 rounded-full bg-rose-50 px-2 py-1 text-[10px] font-extrabold text-rose-600 ring-1 ring-rose-100">{row.original_status}</span>
                  <div className="min-w-0 w-[190px] shrink-0">
                    <div className="truncate text-sm font-bold text-slate-900">{row.customer_name || 'নাম নেই'}</div>
                    <div className="flex items-center gap-1 text-[11px] text-slate-500"><Phone className="h-3 w-3" />{row.customer_phone}</div>
                  </div>
                  <div className="w-[88px] shrink-0 text-right font-extrabold text-emerald-700">{taka(Number(row.total) || 0)}</div>
                  <div className="w-[120px] shrink-0 text-[10px] text-slate-400">{format(new Date(row.deleted_at), 'dd MMM, hh:mm a')}</div>
                  <div className="ml-auto flex shrink-0 items-center gap-1.5">
                    <select value={status} onChange={(event) => setRestoreTargets((current) => ({ ...current, [row.id]: event.target.value as RestoreStatus }))} disabled={busy || bulkBusy} className="h-9 rounded-lg border border-slate-200 bg-slate-50 px-2 text-[11px] font-bold text-slate-700 outline-none transition-all focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/20">
                      {STATUS_OPTIONS.map((item) => <option key={item.value} value={item.value}>{item.label}</option>)}
                    </select>
                    <button type="button" onClick={() => restore(row)} disabled={busy || bulkBusy} className="inline-flex h-9 items-center gap-1 rounded-lg bg-gradient-to-br from-brand to-brand-dark px-3 text-[11px] font-extrabold text-white shadow-sm transition-all duration-300 hover:scale-[1.03] hover:shadow-md active:scale-95 disabled:opacity-50">
                      {busy ? <Loader2 className="h-3.5 w-3.5 animate-spin" /> : <Undo2 className="h-3.5 w-3.5" />}রিস্টোর
                    </button>
                    {data?.canPermanentDelete && <button type="button" onClick={() => permanentlyDelete(row)} disabled={busy || bulkBusy} className="inline-flex h-9 items-center gap-1 rounded-lg border border-rose-200 bg-rose-50 px-2.5 text-[11px] font-extrabold text-rose-700 transition-all duration-300 hover:bg-rose-100 hover:shadow-sm disabled:opacity-50"><Trash2 className="h-3.5 w-3.5" />ডিলিট</button>}
                  </div>
                </div>
                <div className="pointer-events-none absolute inset-x-0 bottom-0 h-px origin-left scale-x-0 bg-gradient-to-r from-brand via-emerald-400 to-transparent transition-transform duration-500 group-hover:scale-x-100" />
              </div>
            );
          })}'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
      - name: Commit only the trash page change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git status --porcelain -- src/routes/admin/deleted-orders.tsx)" != " M src/routes/admin/deleted-orders.tsx" ]; then
            echo 'Trash page was not changed exactly as expected.'
            git status --short
            exit 1
          fi
          git add src/routes/admin/deleted-orders.tsx
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Improve trash order list UI"
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -f .github/workflows/compact-trash-ui.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/compact-trash-ui.yml
            git commit -m "chore: remove temporary UI update workflow"
            git push
          fi
