name: Optimize Orders Pagination

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-orders:
    if: github.event.head_commit.message != 'perf: server-side order pagination'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OrdersTable
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()

          old_query = '''  const { data: orders, isFetching } = useQuery({
    queryKey: ["admin-orders", mode, filter],
    enabled: !isIncomplete,
    staleTime: 15_000,
    placeholderData: keepPreviousData,
    queryFn: async () => {
      const list = (filter === "all" ? statuses : [filter]).filter((s) => s !== "incomplete");
      const { data: ords } = await supabase
        .from("orders")
        .select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,printed_at,created_at,updated_at,created_by,order_items(id,product_name,quantity,price,product_id)")
        .in("status", list as Exclude<OrderStatus, "incomplete">[])
        .order("created_at", { ascending: false })
        .limit(1000);
      return await attachProductImages((ords ?? []) as unknown as OrderRow[]);
    },
  });'''

          new_query = '''  const searchTerm = search.trim().toLowerCase();
  const { data: ordersPage, isFetching } = useQuery({
    queryKey: ["admin-orders", mode, filter, rtsPage, rtsPageSize, searchTerm],
    enabled: !isIncomplete,
    staleTime: 15_000,
    placeholderData: keepPreviousData,
    queryFn: async () => {
      const list = (filter === "all" ? statuses : [filter]).filter((s) => s !== "incomplete");
      const from = (rtsPage - 1) * rtsPageSize;
      const to = from + rtsPageSize - 1;
      let query = supabase
        .from("orders")
        .select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,printed_at,created_at,updated_at,created_by,order_items(id,product_name,quantity,price,product_id)", { count: "exact" })
        .in("status", list as Exclude<OrderStatus, "incomplete">[]);
      if (searchTerm) {
        const escaped = searchTerm.replace(/[%_,]/g, "\\\\$&");
        query = query.or(`invoice_no.ilike.%${escaped}%,customer_phone.ilike.%${escaped}%,customer_name.ilike.%${escaped}%,courier_consignment.ilike.%${escaped}%`);
      }
      const { data: ords, count, error } = await query
        .order(isPendingFilter ? "invoice_no" : "created_at", { ascending: isPendingFilter })
        .range(from, to);
      if (error) throw new Error(error.message);
      return { rows: await attachProductImages((ords ?? []) as unknown as OrderRow[]), total: count ?? 0 };
    },
  });
  const orders = ordersPage?.rows ?? [];
  const serverTotal = ordersPage?.total ?? 0;'''

          if old_query not in s:
              raise SystemExit('orders query block not found; refusing to modify file')
          s = s.replace(old_query, new_query, 1)

          old_rows = '''  const baseRows = isIncomplete ? (incompleteRows ?? []) : (orders ?? []);

  // For incomplete rows we simply open the DetailModal in "draft" mode
  // (no real order created yet). The DetailModal will create the order
  // with status='pending' only when the admin clicks "Create Order".
  const handleOpen = (id: string) => { onOpen(id); };


  const searchTerm = search.trim().toLowerCase();
  const rows = searchTerm
    ? baseRows.filter((o) => {
        const inv = (o.invoice_no ?? o.id).toLowerCase();
        const phone = (o.customer_phone ?? "").toLowerCase();
        const name = (o.customer_name ?? "").toLowerCase();
        const cn = (o.courier_consignment ?? "").toLowerCase();
        return inv.includes(searchTerm) || phone.includes(searchTerm) || name.includes(searchTerm) || cn.includes(searchTerm);
      })
    : baseRows;
  const rtsTotalPages = Math.max(1, Math.ceil(rows.length / rtsPageSize));
  const displayRows = mode === "list" ? rows.slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize) : rows;
  useEffect(() => { setRtsPage(1); }, [filter, mode, search, rtsPageSize]);
  useEffect(() => { if (rtsPage > rtsTotalPages) setRtsPage(rtsTotalPages); }, [rtsPage, rtsTotalPages]);'''

          new_rows = '''  const baseRows = isIncomplete ? (incompleteRows ?? []) : (orders ?? []);
  const rows = baseRows;
  const rtsTotalPages = Math.max(1, Math.ceil((isIncomplete ? rows.length : serverTotal) / rtsPageSize));
  const displayRows = rows;
  // Reset to page 1 when the server-side filter/search/page-size changes.
  useEffect(() => { setRtsPage(1); }, [filter, mode, search, rtsPageSize]);
  useEffect(() => { if (rtsPage > rtsTotalPages) setRtsPage(rtsTotalPages); }, [rtsPage, rtsTotalPages]);'''

          if old_rows not in s:
              raise SystemExit('client pagination block not found; refusing to modify file')
          s = s.replace(old_rows, new_rows, 1)

          p.write_text(s)
      - name: Verify build
        run: |
          corepack enable || true
          npm install -g bun@1.2.15
          bun install --frozen-lockfile
          bun run build
      - name: Commit optimized OrdersTable
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'perf: server-side order pagination'
          git push
