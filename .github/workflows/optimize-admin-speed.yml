name: Optimize admin panel speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-admin-speed.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Apply safe admin performance optimizations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = '''      const { data } = await supabase.from("orders").select("*, order_items(*)").eq("id", id).maybeSingle();
                return (data as unknown as DetailOrder | null) ?? null;'''
          new = '''      const { data, error } = await supabase
                .from("orders")
                .select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,notes,subtotal,delivery_fee,discount,total,created_at,assigned_to,originated_from_incomplete,order_items(id,product_id,product_name,quantity,price,subtotal)")
                .eq("id", id)
                .maybeSingle();
              if (error) throw new Error(error.message);
              return (data as unknown as DetailOrder | null) ?? null;'''
          if old not in s:
              old = '''      const { data } = await supabase.from("orders").select("*, order_items(*)").eq("id", id).maybeSingle();
      return (data as unknown as DetailOrder | null) ?? null;'''
              new = '''      const { data, error } = await supabase
        .from("orders")
        .select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,notes,subtotal,delivery_fee,discount,total,created_at,assigned_to,originated_from_incomplete,order_items(id,product_id,product_name,quantity,price,subtotal)")
        .eq("id", id)
        .maybeSingle();
      if (error) throw new Error(error.message);
      return (data as unknown as DetailOrder | null) ?? null;'''
          if old not in s:
              raise SystemExit('detail query pattern not found')
          s = s.replace(old, new, 1)

          old = '''    queryFn: async () => {
      const { data } = await supabase.from("orders").select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)").in("customer_phone", phoneVariants(lookupPhone)).order("created_at", { ascending: false });
      return data ?? [];
    },
  });'''
          new = '''    queryFn: async () => {
      const { data, error } = await supabase
        .from("orders")
        .select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)")
        .in("customer_phone", phoneVariants(lookupPhone))
        .order("created_at", { ascending: false })
        .limit(50);
      if (error) throw new Error(error.message);
      return data ?? [];
    },
    staleTime: 60_000,
    gcTime: 5 * 60_000,
  });'''
          if old not in s:
              raise SystemExit('history query pattern not found')
          s = s.replace(old, new, 1)

          old = '''    queryFn: async () => {
      let q = supabase.from("products").select("id,name,price,sale_price,sku,images,stock").eq("is_active", true).limit(20);
      if (debouncedSearch) q = q.ilike("name", `%${debouncedSearch}%`);
      return (await q).data ?? [];
    },
    staleTime: 30_000,
    placeholderData: (prev) => prev,
  });'''
          new = '''    enabled: debouncedSearch.trim().length > 0,
    queryFn: async () => {
      const q = supabase
        .from("products")
        .select("id,name,price,sale_price,sku,images,stock")
        .eq("is_active", true)
        .ilike("name", `%${debouncedSearch.trim()}%`)
        .limit(20);
      const { data, error } = await q;
      if (error) throw new Error(error.message);
      return data ?? [];
    },
    staleTime: 60_000,
    gcTime: 5 * 60_000,
    placeholderData: (prev) => prev,
  });'''
          if old not in s:
              raise SystemExit('product query pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/components/admin/AdminLayout.tsx')
          s = p.read_text()
          old = '    <NewOrderNotifier /><AdminOrderStability />\n    <div className="flex-1 min-w-0 transition-all duration-500">'
          new = '    <NewOrderNotifier />\n    {loc.pathname === "/admin/orders" && <AdminOrderStability />}\n    <div className="flex-1 min-w-0 transition-all duration-500">'
          if old not in s:
              raise SystemExit('admin layout pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify build
        run: bun install --frozen-lockfile && bun run build
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx src/components/admin/AdminLayout.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'perf: speed up admin panel loading [skip ci]'
          git push
