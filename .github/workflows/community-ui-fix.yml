name: Community UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply community UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/components/community/SocialFeedProV2.tsx')
          s=p.read_text(encoding='utf-8')
          original=s
          # Keep the main composer input only; the old title input is redundant.
          s=s.replace('placeholder="SHAWON, আজ কী শেয়ার করবেন?" className="min-w-0 flex-1 rounded-xl bg-muted px-3 py-2 text-xs font-medium outline-none"', 'placeholder="কিছু লিখতে চাইলে লিখুন..." className="min-w-0 flex-1 rounded-xl bg-muted px-3 py-2 text-xs font-medium outline-none"')
          # Remove the yellow default Like emoji while keeping the Like action/text.
          s=s.replace("<span>{mine?reactions.find(r=>r[0]===mine.reaction)?.[1]:'👍'}</span>", "<span>{mine?reactions.find(r=>r[0]===mine.reaction)?.[1]:''}</span>")
          # Make an existing reaction click toggle it off, otherwise open the picker.
          old="onClick={()=>setReaction(reactionPost===p.id?null:p.id)}"
          new="onClick={()=>{if(mine)void react(p,mine.reaction);else setReaction(reactionPost===p.id?null:p.id)}}"
          s=s.replace(old,new)
          # Add a compact/mobile-first composer style without changing posting logic.
          marker='return <div className="min-h-screen bg-[#f3f5f4] pb-8">'
          style='return <><style>{`[placeholder="SHAWON, আজ কী শেয়ার করবেন?"]{display:none!important}.community-composer{display:flex;align-items:center;gap:8px}.community-composer textarea,.community-composer input{min-width:0}.community-composer .mt-1\\.5{margin-top:0!important}.community-composer .mt-1\\.5{display:flex!important;align-items:center!important;gap:6px!important;flex:1!important}.community-composer .mt-1\\.5>*{flex-shrink:0}.community-composer .mt-1\\.5 input{flex:1!important}.community-composer button{white-space:nowrap}`}</style><div className="min-h-screen bg-[#f3f5f4] pb-8">'
          if marker in s:
              s=s.replace(marker,style,1)
          # Tag the composer section using the distinctive first placeholder.
          s=s.replace('<section className="border-b bg-background px-3 py-2.5 sm:mt-2 sm:rounded-2xl sm:border">', '<section className="community-composer border-b bg-background px-3 py-2.5 sm:mt-2 sm:rounded-2xl sm:border">', 1)
          if s==original:
              raise SystemExit('No matching community UI changes were found')
          p.write_text(s,encoding='utf-8')
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/community/SocialFeedProV2.tsx
          git rm .github/workflows/community-ui-fix.yml
          git commit -m 'fix: compact community composer and reaction display'
          git push
