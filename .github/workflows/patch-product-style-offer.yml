name: Patch Product Style Offer UI

on:
  push:
    paths:
      - .github/workflows/patch-product-style-offer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Product Style UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/landing/ProductStyleLandingPage.tsx')
          text = path.read_text(encoding='utf-8')

          block = re.compile(r'<div className="hng-image-offer">.*?</div><div className="order-2', re.S)
          text, n = block.subn('<div className="order-2', text, count=1)
          if n != 1:
              raise SystemExit(f'Expected image offer block once, found {n}')

          for cls in [
              'hng-image-offer', 'hng-image-offer-title', 'hng-image-offer-price',
              'hng-image-offer-trust', 'hng-image-offer-cta'
          ]:
              text = re.sub(r'\.' + cls + r'\{[^{}]*\}', '', text, count=1)
          text = text.replace('.hng-image-offer{padding:10px}', '')
          text = text.replace('.hng-image-offer-title{font-size:15px}', '')

          old = '.hng-section-cta{display:flex;justify-content:center;margin:-2px 0 7px}.hng-section-cta button{border:0;border-radius:999px;padding:10px 18px;background:#fff;color:#166534;font-weight:900;font-size:13px;box-shadow:0 7px 20px rgba(22,101,52,.12);border:1px solid #d8eadc;transition:transform .2s,box-shadow .2s}.hng-section-cta button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(22,101,52,.18)}'
          new = '.hng-section-cta{display:flex;justify-content:center;margin:-1px 0 8px}.hng-section-cta button{border:1px solid #355e43;border-radius:12px;padding:11px 20px;background:linear-gradient(135deg,#111713,#050705);color:#fff;font-weight:900;font-size:13px;letter-spacing:.1px;box-shadow:0 9px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .2s,box-shadow .2s,border-color .2s}.hng-section-cta button:hover{transform:translateY(-2px);border-color:#4f8a60;box-shadow:0 12px 28px rgba(0,0,0,.25),0 0 0 3px rgba(53,94,67,.10)}.hng-section-cta button:active{transform:translateY(0) scale(.98)}'
          if old not in text:
              raise SystemExit('CTA CSS block not found')
          text = text.replace(old, new, 1)

          text = text.replace('💚 এই অফারটি আমি চাই — এখনই অর্ডার করি', '🌿 এই অফারটি নিতে — এখনই অর্ডার করুন')
          text = text.replace('⭐ আমিও অর্ডার করতে চাই — আজই নিন', '🛒 অর্ডার করতে প্রস্তুত? এখনই অর্ডার করুন')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git diff --cached --quiet && { echo 'No changes detected'; exit 1; }
          git commit -m "Refine Product Style agriculture CTAs"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-product-style-offer.yml
          git add .github/workflows/patch-product-style-offer.yml
          git commit -m "Remove temporary Product Style patch workflow"
          git push
