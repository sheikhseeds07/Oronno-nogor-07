name: Compact Product Style Image Offer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compact-product-image-offer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant image offer text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text()
          old = '<div className="inline-flex items-center gap-1.5 rounded-full bg-red-50 text-red-600 px-3 py-1.5 text-xs font-black mb-2">🔥 {C.offer_badge_text || "বিশেষ অফার"}</div>'
          s = s.replace(old, '')
          old = '<div className="mt-3 space-y-2 text-sm text-slate-600"><div className="flex items-center gap-2"><Truck className="w-4 h-4" style={{ color: theme }}/>সারা দেশে ক্যাশ অন ডেলিভারি</div><div className="flex items-center gap-2"><ShieldCheck className="w-4 h-4" style={{ color: theme }}/>পণ্য হাতে পেয়ে টাকা পরিশোধ</div></div>'
          s = s.replace(old, '')
          s = s.replace('className="order-2 py-0 sm:py-1"', 'className="order-2 py-0"')
          s = s.replace('className="w-full mt-3 rounded-2xl py-3.5', 'className="w-full mt-2 rounded-2xl py-3')
          p.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git rm .github/workflows/compact-product-image-offer.yml
          git commit -m "Compact Product Style image offer area" || exit 0
          git push
# trigger: image-offer-compact-v2