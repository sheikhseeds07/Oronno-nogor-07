name: Compact Product Style Image Offer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/compact-product-image-offer.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Remove image offer text and keep CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '<div className="hng-image-offer">'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Product image offer block not found')
          depth = 0
          pos = start
          while True:
              open_pos = s.find('<div', pos)
              close_pos = s.find('</div>', pos)
              if close_pos < 0:
                  raise SystemExit('Could not find end of image offer block')
              if open_pos >= 0 and open_pos < close_pos:
                  depth += 1
                  pos = open_pos + 4
              else:
                  depth -= 1
                  pos = close_pos + len('</div>')
                  if depth == 0:
                      end = pos
                      break
          replacement = '<div className="hng-image-compact-cta"><button type="button" onClick={goOrder}>এখনই অর্ডার করুন</button></div>'
          s = s[:start] + replacement + s[end:]
          old_css = '.hng-image-offer{margin-top:8px;padding:12px;border-radius:18px;background:linear-gradient(135deg,#fffdf5,#f0fdf4);border:1px solid #d7e8dc;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.07)}'
          new_css = '.hng-image-compact-cta{display:flex;justify-content:center;margin:8px 0 2px}.hng-image-compact-cta button{width:100%;max-width:300px;border:1px solid #3f7650;border-radius:12px;padding:11px 20px;background:linear-gradient(135deg,#123d24 0%,#0b2a18 100%);color:#fff;font-size:14px;font-weight:900;box-shadow:0 8px 20px rgba(10,58,30,.22),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .2s,box-shadow .2s}.hng-image-compact-cta button:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(10,58,30,.28)}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          else:
              # The block is already compacted; add only the required CTA styles if needed.
              if '.hng-image-compact-cta{' not in s:
                  css_marker = '.hng-section-cta{'
                  if css_marker not in s:
                      raise SystemExit('Product Style CSS marker not found')
                  s = s.replace(css_marker, new_css + css_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate production build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit verified change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git rm .github/workflows/compact-product-image-offer.yml
          git commit -m "Compact Product Style image offer and keep CTA"
          git push origin main
