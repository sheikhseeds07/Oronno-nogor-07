name: One-time remove Karala reviews

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-reviews:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove reviews only for Karala landing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/landing.$slug.tsx')
          s = p.read_text()
          old = '  const hideReviews = isSeedCombo;'
          new = '  const hideReviews = isSeedCombo || slug === "karala";'
          if old not in s:
              raise SystemExit('Expected hideReviews line not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-remove-karala-reviews.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/landing.\$slug.tsx .github/workflows/one-time-remove-karala-reviews.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove customer feedback section from Karala landing'
          git push
