name: Fix Product Style Premium CTA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Update CTA styling safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '.hng-section-cta button{border:0;border-radius:999px;padding:10px 18px;background:#fff;color:#166534;font-weight:900;font-size:13px;box-shadow:0 7px 20px rgba(22,101,52,.12);border:1px solid #d8eadc;transition:transform .2s,box-shadow .2s}.hng-section-cta button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(22,101,52,.18)}'
          new = '.hng-section-cta button{border:1px solid rgba(74,222,128,.45);border-radius:14px;padding:12px 22px;background:linear-gradient(135deg,#166534 0%,#14532d 52%,#052e16 100%);color:#fff;font-weight:950;font-size:14px;box-shadow:0 10px 24px rgba(5,46,22,.28),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;position:relative;overflow:hidden}.hng-section-cta button:hover{transform:translateY(-2px);border-color:rgba(134,239,172,.7);box-shadow:0 14px 30px rgba(5,46,22,.34),inset 0 1px 0 rgba(255,255,255,.2)}.hng-section-cta button:active{transform:translateY(0) scale(.985)}'
          if old not in s:
              raise SystemExit('Expected section CTA style was not found; refusing to modify source.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Commit and push only after successful build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "feat: polish Product Style CTA"
          git push origin main
          git rm .github/workflows/fix-product-cta-premium.yml
          git commit -m "chore: remove temporary CTA repair workflow"
          git push origin main
