name: One-time Cancel Actions Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply only requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old_delete = '(filter === "pending" || filter === "rts")'
          new_delete = '(filter === "pending" || filter === "rts" || filter === "cancelled")'
          if s.count(old_delete) != 1:
              raise SystemExit(f'Expected delete condition exactly once, found {s.count(old_delete)}')
          s = s.replace(old_delete, new_delete, 1)
          old_select = 'onChange={(e) => { const v = e.target.value; if (v && v !== "incomplete") { bulkUpdateStatus(v as Exclude<OrderStatus, "incomplete">); e.target.value = ""; } }}'
          new_select = 'onChange={(e) => { const v = e.target.value; if (v && v !== "incomplete") { const ok = window.confirm(`স্ট্যাটাস "${statusEn[v as OrderStatus]}" এ পরিবর্তন করবেন?`); if (ok) bulkUpdateStatus(v as Exclude<OrderStatus, "incomplete">); e.target.value = ""; } }}'
          if s.count(old_select) != 1:
              raise SystemExit(f'Expected status select handler exactly once, found {s.count(old_select)}')
          s = s.replace(old_select, new_select, 1)
          p.write_text(s)
          wf = Path('.github/workflows/one-time-cancel-actions-fix.yml')
          wf.unlink()
          PY
      - name: Verify exact diff and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx .github/workflows/one-time-cancel-actions-fix.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- src/routes/admin/orders.tsx
          git commit -m 'fix: add cancel delete and confirm status change'
          git push
