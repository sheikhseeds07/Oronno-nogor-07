name: Fix Web Order role visibility

on:
  push:
    paths:
      - .github/workflows/fix-web-order-role-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Web Order visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = '''function Orders() {
  useLiveOrders();'''
          new = '''function Orders() {
  useLiveOrders();
  const { isAdmin } = useAuth();'''
          if old not in s:
              raise SystemExit('Orders() anchor not found')
          s = s.replace(old, new, 1)
          old = '''      {tab === "web" && <OrdersTable statuses={WEB_STATUSES} mode="web" onOpen={setSelected} />}'''
          new = '''      {tab === "web" && (
        <OrdersTable
          statuses={isAdmin ? WEB_STATUSES : WEB_STATUSES.filter((s) => s !== "incomplete")}
          mode="web"
          onOpen={setSelected}
        />
      )}'''
          if old not in s:
              raise SystemExit('Web Orders render anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Restrict incomplete web orders to admins"
          git push
