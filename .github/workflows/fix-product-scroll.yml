name: fix-product-scroll
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_scroll.py
      - name: Commit
        run: |
          git config user.name "lovable-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "fix: CTA scrolls straight to order form fields on product landing pages"
          git push
