name: Patch RTS pagination
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RTS pagination patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          original = s
          old = '  const [search, setSearch] = useState("");\n  const [selectedIds, setSelectedIds] = useState<Set<string>>(new Set());'
          new = '  const [search, setSearch] = useState("");\n  const [rtsPageSize, setRtsPageSize] = useState<20 | 50 | 100>(50);\n  const [rtsPage, setRtsPage] = useState(1);\n  const [selectedIds, setSelectedIds] = useState<Set<string>>(new Set());'
          if old in s and 'rtsPageSize' not in s:
              s = s.replace(old, new, 1)
          old = '''  const rows = searchTerm
    ? baseRows.filter((o) => {
        const inv = (o.invoice_no ?? o.id).toLowerCase();
        const phone = (o.customer_phone ?? "").toLowerCase();
        const name = (o.customer_name ?? "").toLowerCase();
        const cn = (o.courier_consignment ?? "").toLowerCase();
        return inv.includes(searchTerm) || phone.includes(searchTerm) || name.includes(searchTerm) || cn.includes(searchTerm);
      })
    : baseRows;
  const allChecked = rows.length > 0 && rows.every((o) => selectedIds.has(o.id));
  const toggleAll = () => {
    setSelectedIds(() => allChecked ? new Set() : new Set(rows.map((o) => o.id)));
  };'''
          new = '''  const rows = searchTerm
    ? baseRows.filter((o) => {
        const inv = (o.invoice_no ?? o.id).toLowerCase();
        const phone = (o.customer_phone ?? "").toLowerCase();
        const name = (o.customer_name ?? "").toLowerCase();
        const cn = (o.courier_consignment ?? "").toLowerCase();
        return inv.includes(searchTerm) || phone.includes(searchTerm) || name.includes(searchTerm) || cn.includes(searchTerm);
      })
    : baseRows;

  const rtsTotalPages = Math.max(1, Math.ceil(rows.length / rtsPageSize));
  const displayRows = isRtsFilter
    ? rows.slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize)
    : rows;
  useEffect(() => {
    setRtsPage(1);
  }, [filter, mode, search, rtsPageSize]);
  useEffect(() => {
    if (rtsPage > rtsTotalPages) setRtsPage(rtsTotalPages);
  }, [rtsPage, rtsTotalPages]);

  const allChecked = displayRows.length > 0 && displayRows.every((o) => selectedIds.has(o.id));
  const toggleAll = () => {
    setSelectedIds(() => allChecked ? new Set() : new Set(displayRows.map((o) => o.id)));
  };'''
          if old in s and 'const rtsTotalPages' not in s:
              s = s.replace(old, new, 1)
          old = '          orders={rows}\n          loading={isIncomplete ? incompleteFetching : isFetching}'
          new = '          orders={displayRows}\n          loading={isIncomplete ? incompleteFetching : isFetching}'
          if old in s and 'orders={displayRows}' not in s:
              s = s.replace(old, new, 1)
          marker = '''      </div>\n\n      {sendModal && ('''
          pagination = '''      </div>\n\n      {isRtsFilter && rows.length > 0 && (\n        <div className="mt-3 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white px-3 py-2.5 shadow-sm">\n          <div className="flex items-center gap-2 text-xs text-slate-600">\n            <span className="font-semibold">প্রতি পেইজে</span>\n            <select\n              value={rtsPageSize}\n              onChange={(e) => setRtsPageSize(Number(e.target.value) as 20 | 50 | 100)}\n              className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-brand/30"\n            >\n              <option value={20}>20</option>\n              <option value={50}>50</option>\n              <option value={100}>100</option>\n            </select>\n            <span>অর্ডার · মোট {rows.length}</span>\n          </div>\n          <div className="flex items-center gap-1">\n            <button disabled={rtsPage === 1} onClick={() => setRtsPage((p) => Math.max(1, p - 1))} className="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-bold disabled:cursor-not-allowed disabled:opacity-40 hover:bg-slate-50">Previous</button>\n            {Array.from({ length: rtsTotalPages }, (_, i) => i + 1).map((p) => (\n              <button key={p} onClick={() => setRtsPage(p)} className={`min-w-8 rounded-lg px-2 py-1.5 text-xs font-bold ${rtsPage === p ? "bg-gradient-to-br from-brand to-brand-dark text-white shadow-sm" : "border border-slate-200 text-slate-700 hover:bg-slate-50"}`}>{p}</button>\n            ))}\n            <button disabled={rtsPage === rtsTotalPages} onClick={() => setRtsPage((p) => Math.min(rtsTotalPages, p + 1))} className="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-bold disabled:cursor-not-allowed disabled:opacity-40 hover:bg-slate-50">Next</button>\n          </div>\n        </div>\n      )}\n\n      {sendModal && ('''
          if marker in s and 'প্রতি পেইজে' not in s:
              s = s.replace(marker, pagination, 1)
          if s == original:
              raise SystemExit('No changes applied')
          p.write_text(s)
          PY
          if git diff --quiet -- src/routes/admin/orders.tsx; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git commit -m 'Add RTS order list pagination'
          git push