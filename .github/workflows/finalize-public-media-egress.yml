name: Finalize public media egress

on:
  push:
    branches: [fix/public-media-egress-leaks]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-media-egress-leaks
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Patch popup logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/landing/CleanLandingPage.tsx')
          s=p.read_text()
          old='src={logo} alt={brand}'
          new='src={toImg(logo)} alt={brand}'
          if old not in s:
              raise SystemExit('popup logo source not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit only intended source change
        run: |
          git checkout origin/main -- src/routeTree.gen.ts
          rm -f .github/workflows/finalize-public-media-egress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/CleanLandingPage.tsx src/routeTree.gen.ts .github/workflows/finalize-public-media-egress.yml
          git commit -m "Proxy final landing popup logo through media cache"
          git push origin HEAD:fix/public-media-egress-leaks

# one-time trigger
