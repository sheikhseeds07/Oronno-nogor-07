name: Apply Web Order role visibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply Web Order role visibility fix') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch orders page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = 'const WEB_STATUSES: OrderStatus[] = ["web_pending", "incomplete", "hold", "cancelled"];'
          new = old + '\nconst EMPLOYEE_WEB_STATUSES: OrderStatus[] = ["web_pending", "hold", "cancelled"];'
          if 'const EMPLOYEE_WEB_STATUSES' not in s:
              if old not in s:
                  raise SystemExit('WEB_STATUSES marker not found')
              s = s.replace(old, new, 1)
          old2 = 'function Orders() {\n  useLiveOrders();\n  const search = Route.useSearch();'
          new2 = 'function Orders() {\n  useLiveOrders();\n  const { isAdmin } = useAuth();\n  const search = Route.useSearch();'
          if 'const { isAdmin } = useAuth();' not in s:
              if old2 not in s:
                  raise SystemExit('Orders function marker not found')
              s = s.replace(old2, new2, 1)
          old3 = '{tab === "web" && <OrdersTable statuses={WEB_STATUSES} mode="web" onOpen={setSelected} />}'
          new3 = '{tab === "web" && <OrdersTable statuses={isAdmin ? WEB_STATUSES : EMPLOYEE_WEB_STATUSES} mode="web" onOpen={setSelected} />}'
          if old3 in s:
              s = s.replace(old3, new3, 1)
          elif new3 not in s:
              raise SystemExit('Web Order render marker not found')
          p.write_text(s)
          PY

      - name: Commit application change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git commit -m 'Apply Web Order role visibility fix' || true
          git rm .github/workflows/fix-web-order-incomplete-visibility.yml || true
          git commit -m 'chore: remove temporary visibility patch workflow' || true
          git push
