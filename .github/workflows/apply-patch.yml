name: apply-patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and apply
        run: |
          set -e
          curl -fsSL -o /tmp/patch.tgz https://tmpfiles.org/dl/wZwXDxuUmRoW/patch.tgz
          tar -tzf /tmp/patch.tgz
          tar -xzf /tmp/patch.tgz -C .
          rm -f src/lib/invoice-settings.functions.ts
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'invoice: AA1 sequential numbering, remove invoice format settings' || echo nothing
          git push
