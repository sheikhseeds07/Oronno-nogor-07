name: Validate media proxy fix

on:
  pull_request:
    branches: [main]
    paths:
      - src/lib/img.ts
      - src/routes/media.ts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - run: bun run build
