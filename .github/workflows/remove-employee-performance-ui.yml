name: Remove Employee Performance UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-employee-performance-ui.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  remove-performance-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Remove performance UI only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/routes/admin/employees_.$userId.tsx')
          s = p.read_text()

          s = s.replace('import { getEmployeePerformance } from "@/lib/employee-performance.functions";\n', '')
          s = s.replace('import { ArrowLeft, Clock, LogIn, LogOut, XCircle, Pencil, Upload, UserRound, X, Trophy, TrendingUp, Timer, Flame, Star, FileText, Medal } from "lucide-react";', 'import { ArrowLeft, Clock, LogIn, LogOut, XCircle, Pencil, Upload, UserRound, X } from "lucide-react";')

          s = re.sub(r'\n  const fetchPerformance = useServerFn\(getEmployeePerformance\);', '', s)
          s = re.sub(r'\n  const now = new Date\(\);\n  const start = new Date\(now\.getFullYear\(\), now\.getMonth\(\), 1\)\.toISOString\(\)\.slice\(0, 10\);\n  const end = new Date\(now\.getFullYear\(\), now\.getMonth\(\) \+ 1, 0\)\.toISOString\(\)\.slice\(0, 10\);', '', s)
          s = re.sub(r'\n  const \{ data: perf \} = useQuery\(\{ queryKey: \["emp-performance".*?\}\);', '', s)
          s = s.replace(' await qc.invalidateQueries({ queryKey: ["emp-performance", userId] });', '')
          s = s.replace('  const score = perf?.score ?? 0, confirmed = perf?.confirmed ?? 0, cancelled = perf?.cancelled ?? 0, confirmationRate = perf?.confirmationRate ?? 0, cancellationRate = perf?.cancellationRate ?? 0, avgHours = perf?.avgHours ?? 0;\n', '')
          s = s.replace('  const target = perf?.target ?? 0, ranking = perf?.rank ?? 0, teamSize = perf?.teamSize ?? 0, streak = perf?.streak ?? 0, level = perf?.level ?? "Bronze";\n', '')
          s = s.replace('  const achievements = Array.isArray(perf?.achievements) ? perf.achievements : [];\n  const adminNotes = perf?.adminNotes ?? "";\n', '')
          s = re.sub(r'  const autoBadges = .*?\n  const badges = .*?\n  const hasAchievement = .*?\n  const glowClass = .*?\n', '', s, flags=re.S)

          # Remove the entire Performance/Ranking/Achievements/Admin Notes UI block.
          marker = '    <div className="bg-white border rounded-2xl p-5 mb-5 shadow-sm animate-in fade-in slide-in-from-bottom-3 duration-700">'
          start = s.find(marker)
          edit = s.find('    {editing &&', start)
          if start == -1 or edit == -1:
              raise SystemExit('Performance UI block markers not found')
          s = s[:start] + s[edit:]

          # Remove achievement-dependent styling/badge from the profile header.
          s = re.sub(r'\{hasAchievement && <div className="absolute -bottom-2 -right-2.*?</div>\}', '', s, flags=re.S)
          s = re.sub(r'\{level !== "Bronze" && <span.*?</span>\}', '', s, flags=re.S)
          s = re.sub(r'\$\{glowClass\}', 'ring-2 ring-white shadow-lg', s)

          if 'getEmployeePerformance' in s or 'Performance</h2>' in s or 'Monthly Ranking' in s or 'Admin Notes' in s or 'Work Streak' in s:
              raise SystemExit('Performance UI remnants detected')
          if 'useServerFn(getEmployeePerformance)' in s or '["emp-performance"' in s:
              raise SystemExit('Performance fetch remnants detected')

          p.write_text(s)

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build verification
        run: bun run build
      - name: Commit UI removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/employees_.$userId.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'remove employee performance section from profile'
          git push
