name: Fix incomplete order Our Record

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch phone history lookup and remove this one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = '''      const { data } = await supabase.from("orders").select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)").in("customer_phone", phoneVariants(lookupPhone)).order("created_at", { ascending: false });
      return data ?? [];'''
          new = '''      // Match the phone robustly across all order statuses and common BD phone formats.
      // Incomplete checkout rows are drafts in a separate table, so history always
      // queries the real `orders` table independently of the current order source/status.
      const digits = normalizePhone(lookupPhone);
      const variants = phoneVariants(lookupPhone);
      const patterns = Array.from(new Set([
        ...variants,
        ...(digits.length >= 10 ? [digits.slice(-11)] : []),
      ].filter(Boolean)));
      const orQuery = patterns.map((v) => `customer_phone.ilike.%${String(v).replace(/[%(),]/g, "")}%`).join(",");
      const { data, error } = await supabase
        .from("orders")
        .select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)")
        .or(orQuery)
        .order("created_at", { ascending: false });
      if (error) throw new Error(error.message);
      return data ?? [];'''
          if old not in s:
              raise SystemExit('Expected history lookup block not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-incomplete-our-record.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx .github/workflows/fix-incomplete-our-record.yml
          git commit -m 'Fix Our Record for incomplete orders'
          git push

# one-time retrigger
