name: One-time incomplete order banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Patch incomplete order modal
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/routes/admin/orders.tsx")
          text = path.read_text(encoding="utf-8")

          marker = '''          {/* Header */}\n          <div className="px-5 py-3 border-b flex justify-between items-center sticky top-0 bg-white z-10 rounded-t-xl">'''
          replacement = '''          {/* Header */}\n          {isDraft && (\n            <div className="px-5 py-3 border-b-2 border-red-200 bg-red-50 text-center">\n              <div className="text-2xl sm:text-3xl font-extrabold tracking-wide text-red-600">INCOMPLETE ORDER</div>\n            </div>\n          )}\n          <div className="px-5 py-3 border-b flex justify-between items-center sticky top-0 bg-white z-10 rounded-t-xl">'''

          if marker not in text:
              raise SystemExit("Expected DetailModal header marker was not found")
          if "INCOMPLETE ORDER" in text:
              raise SystemExit("INCOMPLETE ORDER banner already exists")

          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

      - name: Verify build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git rm .github/workflows/one-time-incomplete-order-banner.yml
          git commit -m "feat: show incomplete order banner"
          git push
