name: Extend order pagination options

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-orders-pagination:
    if: ${{ !contains(github.event.head_commit.message, '[page-size-persisted]') && !contains(github.event.head_commit.message, '[order-fetch-cap-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove Order List 500-row fetch cap
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/admin/orders.tsx')
          text = path.read_text(encoding='utf-8')
          original = text
          old = '.order("created_at", { ascending: false })\n        .limit(500);'
          new = '.order("created_at", { ascending: false })\n        .limit(1000);'
          if old not in text:
              raise SystemExit('Expected Order List query limit(500) was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Replaced the Order List fetch cap: 500 -> 1000')
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify diff
        run: git diff --check
      - name: Commit code and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/extend-order-pagination.yml
          git add src/routes/admin/orders.tsx
          git commit -m "fix: remove Order List 500-row fetch cap [order-fetch-cap-fixed]"
          git push