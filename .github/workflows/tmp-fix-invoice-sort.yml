name: Temporary Invoice Sort Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: sort order list invoices descending'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invoice sorting
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()

          old_display = '  const displayRows = mode === "list" ? rows.slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize) : rows;'
          new_display = '''  const displayRows = mode === "list"
    ? [...rows]
        .sort((a, b) => {
          const aInvoice = a.invoice_no ?? "";
          const bInvoice = b.invoice_no ?? "";
          if (aInvoice && bInvoice) {
            return bInvoice.localeCompare(aInvoice, undefined, { numeric: true, sensitivity: "base" });
          }
          if (aInvoice) return -1;
          if (bInvoice) return 1;
          return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
        })
        .slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize)
    : rows;'''
          if old_display not in s:
              raise SystemExit('displayRows block not found; refusing to modify file')
          s = s.replace(old_display, new_display, 1)

          old_print = '        return aInvoice.localeCompare(bInvoice, undefined, { numeric: true, sensitivity: "base" });'
          new_print = '        return bInvoice.localeCompare(aInvoice, undefined, { numeric: true, sensitivity: "base" });'
          if old_print not in s:
              raise SystemExit('invoice print sort block not found; refusing to modify file')
          s = s.replace(old_print, new_print, 1)

          p.write_text(s)
      - name: Verify build
        run: |
          corepack enable || true
          npm install -g bun@1.2.15
          bun install --frozen-lockfile
          bun run build
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-fix-invoice-sort.yml
          git add -- src/routes/admin/orders.tsx .github/workflows/tmp-fix-invoice-sort.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: sort order list invoices descending'
          git push
