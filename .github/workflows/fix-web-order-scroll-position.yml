name: Fix Web Order Scroll Position

on:
  push:
    paths:
      - '.github/workflows/fix-web-order-scroll-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch orders route and remove this workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const orderPath = 'src/routes/admin/orders.tsx';
            const workflowPath = '.github/workflows/fix-web-order-scroll-position.yml';
            const ref = 'main';
            const file = await github.rest.repos.getContent({ owner, repo, path: orderPath, ref });
            const content = Buffer.from(file.data.content, 'base64').toString('utf8');
            const oldText = `  const setSelected = (id: string | null) =>\n    navigate({ search: (p: typeof search) => ({ ...p, selected: id ?? undefined }) });`;
            const newText = `  const setSelected = (id: string | null) =>\n    navigate({\n      search: (p: typeof search) => ({ ...p, selected: id ?? undefined }),\n      resetScroll: false,\n    });`;
            if (content.includes(oldText)) {
              const next = content.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: orderPath, message: 'fix: preserve orders scroll when closing order detail', content: Buffer.from(next, 'utf8').toString('base64'), sha: file.data.sha, branch: ref });
              core.info('Patched orders route.');
            } else {
              core.info('Patch already applied; no order file change needed.');
            }
            const wf = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref });
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, message: 'chore: remove one-time scroll fix workflow', sha: wf.data.sha, branch: ref });
            core.info('Removed one-time workflow.');
