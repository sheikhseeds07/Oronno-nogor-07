name: Update Product Style CTA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-product-style-cta.yml']

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Update CTA text only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '💚 এই অফারটি আমি চাই — এখনই অর্ডার করি'
          new = 'দ্রুত অর্ডার করতে চাই'
          if old not in s:
              raise SystemExit('Target CTA text was not found; refusing to modify the source.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build verification
        run: bun run build

      - name: Commit verified change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git rm .github/workflows/update-product-style-cta.yml
          git commit -m "Refine Product Style order CTA"
          git push origin main
