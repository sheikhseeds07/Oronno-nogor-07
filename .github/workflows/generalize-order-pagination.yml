name: Generalize order list pagination
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pagination to every Order List status
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/routes/admin/orders.tsx')
          s=p.read_text()
          s=s.replace('const displayRows = isRtsFilter ? rows.slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize) : rows;', 'const displayRows = mode === "list" ? rows.slice((rtsPage - 1) * rtsPageSize, rtsPage * rtsPageSize) : rows;')
          s=s.replace('useEffect(() => { setRtsPage(1); }, [filter, mode, search, rtsPageSize]);', 'useEffect(() => { setRtsPage(1); }, [filter, mode, search, rtsPageSize]);')
          s=s.replace('{isRtsFilter && rows.length > 0 && (', '{mode === "list" && rows.length > 0 && (')
          s=s.replace('setRtsPageSize(Number(e.target.value) as 20 | 50 | 100)', 'setRtsPageSize(Number(e.target.value) as 20 | 50 | 100)')
          if s == p.read_text(): raise SystemExit('No changes applied')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git commit -m 'Add pagination to all Order List statuses' || exit 0
          git push
          rm -f .github/workflows/generalize-order-pagination.yml
          git add .github/workflows/generalize-order-pagination.yml
          git commit -m 'Remove pagination patch workflow' || exit 0
          git push
