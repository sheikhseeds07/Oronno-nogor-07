name: Patch Our Record for incomplete orders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch history lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          pattern = re.compile(r'      const \{ data \} = await supabase\.from\("orders"\)\.select\("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items\(product_name,quantity\)"\)\.in\("customer_phone", phoneVariants\(lookupPhone\)\)\.order\("created_at", \{ ascending: false \}\);\n      return data \?\? \[\];')
          new = '''      // Our Record searches the real orders table by normalized phone across every status/source.
      const digits = normalizePhone(lookupPhone);
      const variants = phoneVariants(lookupPhone);
      const patterns = Array.from(new Set([
        ...variants,
        ...(digits.length >= 10 ? [digits.slice(-11)] : []),
      ].filter(Boolean)));
      const orQuery = patterns
        .map((v) => `customer_phone.ilike.%${String(v).replace(/[%(),]/g, "")}%`)
        .join(",");
      const { data, error } = await supabase
        .from("orders")
        .select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)")
        .or(orQuery)
        .order("created_at", { ascending: false });
      if (error) throw new Error(error.message);
      return data ?? [];'''
          if pattern.search(s):
              p.write_text(pattern.sub(new, s, count=1))
          else:
              print('Target already patched or not found; nothing to do.')
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- src/routes/admin/orders.tsx; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git commit -m 'Fix Our Record for incomplete orders'
          git push
