name: Patch Our Record for incomplete orders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch history lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = '''      const { data } = await supabase.from("orders").select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)").in("customer_phone", phoneVariants(lookupPhone)).order("created_at", { ascending: false });\n      return data ?? [];'''
          new = '''      // Our Record must search the real orders table by phone, regardless of the current order source/status.
      // This is especially important when the currently opened row is an incomplete checkout draft.
      const digits = normalizePhone(lookupPhone);
      const variants = phoneVariants(lookupPhone);
      const patterns = Array.from(new Set([
        ...variants,
        ...(digits.length >= 10 ? [digits.slice(-11)] : []),
      ].filter(Boolean)));
      const orQuery = patterns
        .map((v) => `customer_phone.ilike.%${String(v).replace(/[%(),]/g, "")}%`)
        .join(",");
      const { data, error } = await supabase
        .from("orders")
        .select("id,invoice_no,status,total,created_at,customer_name,customer_address,thana,district,order_items(product_name,quantity)")
        .or(orQuery)
        .order("created_at", { ascending: false });
      if (error) throw new Error(error.message);
      return data ?? [];'''
          if old not in s:
              raise SystemExit('Target Our Record lookup block not found; no change made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          git commit -m 'Fix Our Record for incomplete orders'
          git push