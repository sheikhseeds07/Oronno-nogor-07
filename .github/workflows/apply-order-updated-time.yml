name: Apply order updated-time UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[order-updated-time-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch order list
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/admin/orders.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'courier_consignment,printed_at,created_at,order_items(id,product_name,quantity,price,product_id)'
          new = 'courier_consignment,printed_at,created_at,updated_at,order_items(id,product_name,quantity,price,product_id)'
          if old not in text:
              raise SystemExit('orders select pattern not found')
          text = text.replace(old, new, 1)

          old = 'created_at: string; total: number; status: OrderStatus;'
          new = 'created_at: string; updated_at?: string | null; total: number; status: OrderStatus;'
          if old not in text:
              raise SystemExit('OrderRow type pattern not found')
          text = text.replace(old, new, 1)

          old = 'created_at: r.updated_at ?? r.created_at,\n        total: Number(r.total ?? 0),'
          new = 'created_at: r.updated_at ?? r.created_at,\n        updated_at: r.updated_at ?? r.created_at,\n        total: Number(r.total ?? 0),'
          if old not in text:
              raise SystemExit('incomplete row mapping pattern not found')
          text = text.replace(old, new, 1)

          marker = 'function OrdersTableRows({'
          helper = '''function RelativeUpdatedTime({ value }: { value?: string | null }) {\n  const [, refresh] = useState(0);\n\n  useEffect(() => {\n    const timer = window.setInterval(() => refresh((v) => v + 1), 30_000);\n    return () => window.clearInterval(timer);\n  }, []);\n\n  if (!value) return null;\n  const timestamp = new Date(value).getTime();\n  if (!Number.isFinite(timestamp)) return null;\n\n  const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));\n  let label = 'এইমাত্র';\n  if (seconds >= 86400) label = `${Math.floor(seconds / 86400)} দিন`;\n  else if (seconds >= 3600) label = `${Math.floor(seconds / 3600)} ঘণ্টা`;\n  else if (seconds >= 60) label = `${Math.floor(seconds / 60)} মিনিট`;\n  else if (seconds > 0) label = `${seconds} সেকেন্ড`;\n\n  return (\n    <div\n      className=\"text-[10px] text-slate-400 mt-0.5\"\n      title={`শেষ আপডেট: ${format(new Date(value), \"dd MMM yyyy, hh:mm a\")}`}\n    >\n      শেষ আপডেট: {label}{label === 'এইমাত্র' ? '' : ' আগে'}\n    </div>\n  );\n}\n\n'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('OrdersTableRows marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''                    <div className="text-xs text-muted-foreground line-clamp-2">\n                      {[o.customer_address, o.thana, o.district].filter(Boolean).join(", ")}\n                    </div>'''
          new = '''                    <div className="text-xs text-muted-foreground line-clamp-2">\n                      {[o.customer_address, o.thana, o.district].filter(Boolean).join(", ")}\n                    </div>\n                    <RelativeUpdatedTime value={o.updated_at ?? o.created_at} />'''
          if old not in text:
              raise SystemExit('customer address render pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx .github/workflows/apply-order-updated-time.yml
          git rm .github/workflows/apply-order-updated-time.yml
          git commit -m "feat: show relative order updated time [order-updated-time-patch]"
          git push