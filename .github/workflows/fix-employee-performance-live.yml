name: Fix Employee Performance Live Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-employee-performance-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Patch performance calculation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/employee-performance.functions.ts')
          s = p.read_text()
          old = '''    // Confirmation/cancellation counts stay aligned with the Dashboard source of truth.
    for (const row of dashboardRows) {
      const id = String(row?.user_id ?? "");
      const m = metrics.get(id);
      if (!m) continue;
      m.confirmed = Number(row?.confirmed ?? 0);
      m.cancelled = Number(row?.cancelled ?? 0);
    }
'''
          new = '''    // Count performance against the employee who owns the order.
    for (const order of orders ?? []) {
      const id = String(order?.assigned_to ?? "");
      const m = metrics.get(id);
      if (!m) continue;
      if (isCancelled(order)) m.cancelled++;
      else if (isDelivered(order) || isShipped(order) || ["pending", "rts", "partial"].includes(statusOf(order))) m.confirmed++;
    }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Count performance against the employee who owns the order.' not in s:
              raise SystemExit('performance marker not found')
          required = ['Count performance against the employee who owns the order.', 'if (isCancelled(order)) m.cancelled++;']
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit('Patch incomplete: ' + ', '.join(missing))
          p.write_text(s)
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build verification
        run: bun run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/employee-performance.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: calculate employee performance from assigned orders'
          git push
