name: One-time R2 migration trigger

on:
  push:

jobs:
  trigger:
    if: github.event.head_commit.message == 'chore: trigger R2 migration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/dispatches -f event_type=run-r2-migration
