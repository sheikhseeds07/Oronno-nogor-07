name: Fix All Product Floating CTA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch All Product landing checkout CTA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/landing/AllProductLandingPage.tsx')
          s = p.read_text()

          if 'const [checkoutStarted, setCheckoutStarted]' not in s:
              s = s.replace('  const [submitting, setSubmitting] = useState(false);', '  const [submitting, setSubmitting] = useState(false);\n  const [checkoutStarted, setCheckoutStarted] = useState(false);', 1)

          if 'const handleFloatingCta' not in s:
              marker = '  const goOrder = () => document.getElementById("all-product-order")?.scrollIntoView({ behavior: "smooth", block: "start" });'
              insert = marker + '''\n  useEffect(() => {\n    const el = document.getElementById("all-product-order");\n    if (!el || typeof IntersectionObserver === "undefined") return;\n    const observer = new IntersectionObserver(([entry]) => {\n      if (entry.isIntersecting) setCheckoutStarted(true);\n    }, { threshold: 0.08 });\n    observer.observe(el);\n    return () => observer.disconnect();\n  }, []);\n\n  const handleFloatingCta = () => {\n    if (!checkoutStarted) {\n      goOrder();\n      return;\n    }\n    document.getElementById("all-product-order-form")?.requestSubmit();\n  };'''
              if marker not in s:
                  raise SystemExit('goOrder marker not found')
              s = s.replace(marker, insert, 1)

          if 'id="all-product-order-form"' not in s:
              s = s.replace('<form onSubmit={submit}', '<form id="all-product-order-form" onSubmit={submit}', 1)

          # Remove only the main checkout submit button, leaving all checkout fields and logic intact.
          s, removed = re.subn(r'<Button type="submit" disabled=\{submitting\} className="all-product-primary-cta h-14 w-full text-base font-black">.*?</Button>', '', s, count=1, flags=re.S)

          # Replace the All Product template's floating CTA only.
          pattern = r'<div className="fixed inset-x-0 bottom-0 z-40 border-t border-all-product-line bg-all-product-surface/95 p-2 backdrop-blur-lg[^>]*>\s*<Button[^>]*onClick=\{goOrder\}[^>]*>.*?</Button>\s*</div>'
          replacement = '''<div className="fixed inset-x-0 bottom-0 z-40 border-t border-all-product-line bg-all-product-surface/95 p-2 backdrop-blur-lg">\n      <Button type="button" onClick={handleFloatingCta} disabled={submitting} className="all-product-primary-cta h-12 w-full font-black">\n        <ShoppingBag />\n        {checkoutStarted ? (submitting ? "অর্ডার হচ্ছে..." : `অর্ডার টি কনফার্ম করুন ${taka(total)}`) : `${page.cta_text || "অর্ডার করুন"} — ${taka(basePrice)}`}\n      </Button>\n    </div>'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'floating CTA not found; removed={removed}')

          p.write_text(s)
          print('patched AllProductLandingPage.tsx')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/AllProductLandingPage.tsx
          git commit -m 'fix: make all-product floating CTA place orders at checkout'
          git push
