name: Apply staff customer history migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-staff-customer-history.yml'
      - 'supabase/migrations/20260911050000_staff_customer_history.sql'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: frtzlibogmethppqmhtr
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          from pathlib import Path
          sql = Path('supabase/migrations/20260911050000_staff_customer_history.sql').read_text()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", 'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions-StaffHistoryMigration/1.0'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              print('Migration response:', response.status)
          PYCODE
