name: sync-home
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updated files
        run: |
          B=https://id-preview--00f44264-052b-460f-ac53-9762a9cef8f2.lovable.app/__l5e/assets-v1
          curl -fsSL "$B/e84e0084-2bf6-4820-b3f3-d040432378e7/banner-seeds.jpg" -o public/banner-seeds.jpg
          curl -fsSL "$B/103ccfa5-1493-4471-a0d6-1ad9eb8749a4/banner-tools.jpg" -o public/banner-tools.jpg
          curl -fsSL "$B/d6064b9e-c3b4-4968-979f-92c33f18730d/banner-fertilizer.jpg" -o public/banner-fertilizer.jpg
          curl -fsSL "$B/93c12425-78a5-4301-b7f8-ea8ac6632d1a/index.tsx.txt" -o src/routes/index.tsx
          curl -fsSL "$B/ac8bbb14-bcc5-498b-9de1-2d716d0aea39/TopBar.tsx.txt" -o src/components/layout/TopBar.tsx
      - name: Commit
        run: |
          git config user.name "shawon079"
          git config user.email "146602441+shawon079@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/sync-home.yml
          git add -A
          git commit -m "home: single-line topbar tagline, banner images, polished benefits section" || echo "no changes"
          git push
