name: Fix Product Style first-paint loading flash
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build before change
        run: bun run build
      - name: Apply safe first-paint fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/landing/ProductStyleLandingPage.tsx')
          s=p.read_text()
          old='if (isLoading) return <div className="min-h-screen grid place-items-center bg-[#fafcf9]"><div className="animate-pulse font-bold">লোড হচ্ছে...</div></div>;'
          new='if (isLoading) return <div className="min-h-screen bg-[#f7f9f6]" aria-hidden="true" />;'
          if old not in s: raise SystemExit('Expected loading fallback not found; refusing unsafe edit')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build after change
        run: bun run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Product Style first-paint loading flash'
          git push origin main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-product-style-first-paint.yml
          git commit -m 'Remove temporary first-paint fix workflow'
          git push origin main
