name: One-time Karala CTA finalizer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-karala-cta-finalize.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Apply CTA sizing and animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          if 'hng-image-compact-cta' not in s:
              raise SystemExit('Image CTA is not present; aborting safely.')
          marker = '.hng-image-compact-cta{display:flex;justify-content:center;margin:8px 0 2px}'
          if marker not in s:
              raise SystemExit('Expected CTA CSS marker not found; aborting safely.')
          css = ''' .hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order{width:min(320px,100%)!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0 22px!important;position:relative!important;overflow:hidden!important;will-change:transform,box-shadow!important;animation:hngUnifiedCtaPulse 2.8s ease-in-out infinite!important;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease,filter .22s ease!important}.hng-image-compact-cta button::before,.hng-section-cta button::before,.hng-image-offer-cta::before,.hng-guarantee-order::before{content:"";position:absolute;inset:-20% auto -20% -45%;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.58),transparent);transform:translateX(-140%) skewX(-18deg);animation:hngUnifiedCtaShine 3.6s ease-in-out infinite;pointer-events:none}.hng-image-compact-cta button:hover,.hng-section-cta button:hover,.hng-image-offer-cta:hover,.hng-guarantee-order:hover{transform:translateY(-3px)!important;box-shadow:0 16px 34px rgba(22,101,52,.30)!important;filter:saturate(1.06)}.hng-image-compact-cta button:active,.hng-section-cta button:active,.hng-image-offer-cta:active,.hng-guarantee-order:active{transform:translateY(-1px) scale(.985)!important}@keyframes hngUnifiedCtaPulse{0%,100%{transform:translateY(0);box-shadow:0 10px 26px rgba(22,101,52,.22),0 0 0 0 rgba(34,197,94,.14)}50%{transform:translateY(-2px);box-shadow:0 14px 32px rgba(22,101,52,.28),0 0 0 7px rgba(34,197,94,0)}}@keyframes hngUnifiedCtaShine{0%,35%{transform:translateX(-140%) skewX(-18deg);opacity:0}45%{opacity:.7}70%,100%{transform:translateX(320%) skewX(-18deg);opacity:0}}@media(max-width:640px){.hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order{height:52px!important;min-height:52px!important;font-size:16px}}@media(prefers-reduced-motion:reduce){.hng-image-compact-cta button,.hng-section-cta button,.hng-image-offer-cta,.hng-guarantee-order{animation:none!important}.hng-image-compact-cta button::before,.hng-section-cta button::before,.hng-image-offer-cta::before,.hng-guarantee-order::before{animation:none!important}}'''
          s = s.replace(marker, marker + css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build verification
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx
          git commit -m 'feat: unify Karala CTA sizing and animation'
          git push origin main
          git rm .github/workflows/one-time-karala-cta-finalize.yml
          git commit -m 'chore: remove one-time Karala CTA finalizer'
          git push origin main
