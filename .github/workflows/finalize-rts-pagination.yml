name: Finalize RTS pagination
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix selection and remove patch workflows
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/routes/admin/orders.tsx')
          s=p.read_text()
          s=s.replace('new Set(rows.map((o) => o.id))','new Set(displayRows.map((o) => o.id))',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/patch-rts-pagination.yml .github/workflows/finalize-rts-pagination.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx .github/workflows
          git commit -m 'Finalize RTS pagination' || exit 0
          git push
