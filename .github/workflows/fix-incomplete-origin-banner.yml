name: Fix incomplete origin banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch banner logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()

          old = '  assigned_to?: string | null;\n};'
          new = '  assigned_to?: string | null;\n  originated_from_incomplete?: boolean | null;\n};'
          if old in s and 'originated_from_incomplete?: boolean | null;' not in s:
              s = s.replace(old, new, 1)

          old = '          {isDraft && (\n            <div className="px-5 py-3 border-b-2 border-red-200 bg-red-50 text-center">'
          new = '          {(isDraft || !!detail?.originated_from_incomplete) && (\n            <div className="px-5 py-3 border-b-2 border-red-200 bg-red-50 text-center">'
          if old not in s:
              raise SystemExit('Banner header pattern not found')
          s = s.replace(old, new, 1)

          old = '            payment_method: "cod",\n          },'
          new = '            payment_method: "cod",\n            originated_from_incomplete: true,\n          },'
          if old in s and 'originated_from_incomplete: true,' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/routes/admin/orders.tsx

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git rm .github/workflows/fix-incomplete-origin-banner.yml
          git commit -m "fix: show incomplete banner for originated orders"
          git push
