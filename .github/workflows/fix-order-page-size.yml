name: Fix Order List page size persistence
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Order List page size persistence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const [rtsPageSize, setRtsPageSize] = useState<20 | 50 | 100>(50);'
          new = '''const PAGE_SIZE_KEY = "order-list-page-size";
  const PAGE_SIZES = [20, 50, 70, 100, 200, 500] as const;
  type PageSize = (typeof PAGE_SIZES)[number];
  const [rtsPageSize, setRtsPageSize] = useState<PageSize>(() => {
    if (typeof window === "undefined") return 50;
    const saved = Number(window.localStorage.getItem(PAGE_SIZE_KEY));
    return PAGE_SIZES.includes(saved as PageSize) ? (saved as PageSize) : 50;
  });
  useEffect(() => {
    window.localStorage.setItem(PAGE_SIZE_KEY, String(rtsPageSize));
  }, [rtsPageSize]);'''
          if old in s:
              s = s.replace(old, new, 1)
          old_select = 'setRtsPageSize(Number(e.target.value) as 20 | 50 | 100)'
          if old_select in s:
              s = s.replace(old_select, 'setRtsPageSize(Number(e.target.value) as PageSize)', 1)
          old_opts = '<option value={20}>20</option><option value={50}>50</option><option value={100}>100</option>'
          new_opts = '<option value={20}>20</option><option value={50}>50</option><option value={70}>70</option><option value={100}>100</option><option value={200}>200</option><option value={500}>500</option>'
          if old_opts in s:
              s = s.replace(old_opts, new_opts, 1)
          p.write_text(s, encoding='utf-8')
      - name: Build
        run: bun install --frozen-lockfile && bun run build
      - name: Commit and push final code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-order-page-size.yml
          git add src/routes/admin/orders.tsx
          git commit -m 'fix: Order List page size persistence'
          git push
