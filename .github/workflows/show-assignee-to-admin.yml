name: One-time admin assignee patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-assignee-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/routes/admin/orders.tsx")
          text = path.read_text()

          old = '.select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,courier_display_name,printed_at,created_at,updated_at,created_by,order_items(id,product_name,quantity,price,product_id)")'
          new = '.select("id,invoice_no,status,customer_name,customer_phone,customer_address,thana,district,total,courier_consignment,courier_display_name,printed_at,created_at,updated_at,created_by,assigned_to,order_items(id,product_name,quantity,price,product_id)")'
          if old not in text: raise SystemExit("orders select target not found")
          text = text.replace(old, new, 1)

          old = 'const creatorIds = Array.from(new Set((orders ?? []).map((o) => o.created_by).filter((x): x is string => !!x)));'
          new = 'const creatorIds = Array.from(new Set((orders ?? []).flatMap((o) => [o.created_by, o.assigned_to]).filter((x): x is string => !!x)));'
          if old not in text: raise SystemExit("creator ids target not found")
          text = text.replace(old, new, 1)

          old = '''  const isWeb = mode === "web";\n  const isList = mode === "list";'''
          new = '''  const isWeb = mode === "web";\n  const isList = mode === "list";\n  const { isAdmin } = useAuth();'''
          if old not in text: raise SystemExit("admin hook target not found")
          text = text.replace(old, new, 1)

          old = '''                    const creatorName = o.created_by ? creatorMap?.get(o.created_by) : undefined;'''
          new = '''                    const creatorName = o.created_by ? creatorMap?.get(o.created_by) : undefined;\n                    const assignedName = o.assigned_to ? creatorMap?.get(o.assigned_to) : undefined;'''
          if old not in text: raise SystemExit("name target not found")
          text = text.replace(old, new, 1)

          old = '''                          {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          new = '''                          {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}\n                          {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          if old not in text: raise SystemExit("locked row target not found")
          text = text.replace(old, new, 1)

          old = '''                        {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          new = '''                        {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}\n                        {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          if old not in text: raise SystemExit("open row target not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit and remove patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/show-assignee-to-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx .github/workflows/show-assignee-to-admin.yml
          git commit -m "feat: show assigned employee to admins in orders [skip-assignee-patch]"
          git push