name: apply-ceo-admin-permissions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore: finalize CEO controlled admin sidebar permissions')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply permission model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/admin/AdminLayout.tsx')
          s = p.read_text()
          replacements = {
            '{ to: "/admin/products", label: "Products", icon: Package, perm: "products", tone: "from-amber-400 to-orange-500" },': '{ to: "/admin/products", label: "Products", icon: Package, perm: "products", tone: "from-amber-400 to-orange-500" },\n  { to: "/admin/offers", label: "Offers", icon: Sparkles, perm: "offers", tone: "from-emerald-400 to-teal-500" },',
            '{ to: "/admin/banners", label: "Banners", icon: ImageIcon, perm: "marketing", tone: "from-rose-400 to-red-500" },': '{ to: "/admin/banners", label: "Banners", icon: ImageIcon, perm: "banners", tone: "from-rose-400 to-red-500" },',
            '{ to: "/admin/coupons", label: "Coupons", icon: Tag, perm: "marketing", tone: "from-yellow-400 to-orange-500" },': '{ to: "/admin/coupons", label: "Coupons", icon: Tag, perm: "coupons", tone: "from-yellow-400 to-orange-500" },',
            '{ to: "/admin/employees", label: "Employees", icon: UserCog, perm: "hrm", tone: "from-green-400 to-emerald-600" },': '{ to: "/admin/employees", label: "Employees", icon: UserCog, perm: "employees", tone: "from-green-400 to-emerald-600" },',
            '{ to: "/admin/attendance", label: "Attendance", icon: Clock, perm: "hrm", tone: "from-violet-400 to-purple-600" },': '{ to: "/admin/attendance", label: "Attendance", icon: Clock, perm: "attendance", tone: "from-violet-400 to-purple-600" },',
            'if (isAdmin) return true;': 'if (role === "super_admin") return true;',
          }
          for a,b in replacements.items(): s = s.replace(a,b)
          p.write_text(s)

          # Keep the temporary workflow from being needed again after this successful patch.
          wf = Path('.github/workflows/implement-ceo-admin-permissions.yml')
          w = wf.read_text()
          w = w.replace("if: \"!contains(github.event.head_commit.message, 'chore: finalize CEO controlled admin sidebar permissions')\"", "if: \"!contains(github.event.head_commit.message, 'chore: finalize CEO controlled admin sidebar permissions')\"")
          wf.write_text(w)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminLayout.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize CEO controlled admin sidebar permissions'
          git push
