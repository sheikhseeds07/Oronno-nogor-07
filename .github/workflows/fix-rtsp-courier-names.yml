name: Fix employee RTS courier access
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee RTS courier access
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'import { sendOrdersToSteadfast, syncSteadfastStatuses } from "@/lib/courier-test.functions";',
              'import { getSteadfastDisplayNames, sendOrdersToSteadfast, syncSteadfastStatuses } from "@/lib/courier-test.functions";',
              1,
          )
          marker = '  const qc = useQueryClient();\n  const sendBulk = useServerFn(sendOrdersToSteadfast);'
          if marker in s and 'const getCourierNames = useServerFn(getSteadfastDisplayNames);' not in s:
              s = s.replace(marker, marker + '\n  const getCourierNames = useServerFn(getSteadfastDisplayNames);', 1)
          pattern = re.compile(r'''  useEffect\(\(\) => \{\n    let alive = true;\n    \(async \(\) => \{\n      const \{ data \} = await supabase\.from\("integrations"\)\.select\("name,config"\)\.in\("name", \["all_api_steadfast", "all_api_steadfast_2"\]\);\n      if \(!alive\) return;\n      const next: Record<1 \| 2, string> = \{ 1: [^\n]+\};\n      for \(const row of data \?\? \[\]\) \{\n        const cfg = \(row\.config \?\? \{\}\) as \{ display_name\?: string \};\n        if \(row\.name === "all_api_steadfast" && cfg\.display_name\?\.trim\(\)\) next\[1\] = cfg\.display_name\.trim\(\);\n        if \(row\.name === "all_api_steadfast_2" && cfg\.display_name\?\.trim\(\)\) next\[2\] = cfg\.display_name\.trim\(\);\n      \}\n      if \(alive\) setCourierDisplayNames\(next\);\n    \}\)\(\);\n    return \(\) => \{ alive = false; \};\n  \}, \[\]\);''', re.M)
          replacement = '''  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const res = await getCourierNames({ data: {} });
        if (!alive) return;
        setCourierDisplayNames(res.names);
      } catch {
        // Keep safe fallback labels when server lookup is unavailable.
      }
    })();
    return () => { alive = false; };
  }, [getCourierNames]);'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('RTS courier display-name effect was not found')
          p.write_text(s, encoding='utf-8')

          p = Path('src/lib/courier-test.functions.ts')
          s = p.read_text(encoding='utf-8')
          if 'export const getSteadfastDisplayNames' not in s:
              end = s.find('\n}\n\nexport const sendOrdersToSteadfast')
              if end < 0:
                  raise SystemExit('sendOrdersToSteadfast anchor not found')
              insert = '''

export const getSteadfastDisplayNames = createServerFn({ method: "GET" })
  .middleware([requireSupabaseAuth])
  .handler(async ({ context }) => {
    await assertCanManageOrders(context.userId);
    const { data: rows } = await supabaseAdmin
      .from("integrations")
      .select("name,config,is_active")
      .in("name", [STEADFAST_ROW_NAME[1], STEADFAST_ROW_NAME[2], "courier_steadfast"]);
    const names: Record<1 | 2, string> = { 1: "কুরিয়ার ১", 2: "কুরিয়ার ২" };
    for (const account of [1, 2] as const) {
      const exact = (rows ?? []).find((row) => row.name === STEADFAST_ROW_NAME[account] && row.is_active);
      const fallback = account === 1 ? (rows ?? []).find((row) => row.name === "courier_steadfast" && row.is_active) : undefined;
      const row = exact ?? fallback;
      const cfg = (row?.config ?? {}) as Record<string, unknown>;
      const displayName = typeof cfg.display_name === "string" ? cfg.display_name.trim() : "";
      if (displayName) names[account] = displayName;
    }
    return { names };
  });'''
              s = s[:end+2] + insert + s[end+2:]
          old = '  const row = (rows ?? []).find((r) => r.name === name && r.is_active) ?? (rows ?? []).find((r) => r.is_active) ?? (rows ?? [])[0];'
          new = '''  const row = (rows ?? []).find((r) => r.name === name && r.is_active)
    ?? (rows ?? []).find((r) => r.name === name)
    ?? (rows ?? []).find((r) => r.is_active)
    ?? (rows ?? [])[0];'''
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx src/lib/courier-test.functions.ts
          git commit -m 'fix: allow employees to send RTS via courier'
          git push origin HEAD:main
          git rm -f .github/workflows/fix-rtsp-courier-names.yml
          git commit -m 'chore: remove temporary RTS courier patch workflow'
          git push origin HEAD:main
