name: Fix courier display on invoice
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply courier invoice patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          old = 'courier_consignment,printed_at,created_at,updated_at,created_by,order_items('
          new = 'courier_consignment,courier_display_name,printed_at,created_at,updated_at,created_by,order_items('
          if 'courier_consignment,courier_display_name,printed_at' not in s and old in s:
              s = s.replace(old, new, 1)
          old = 'courier_consignment?: string | null; printed_at?: string | null;'
          new = 'courier_consignment?: string | null; courier_display_name?: string | null; printed_at?: string | null;'
          if 'courier_display_name?: string | null' not in s and old in s:
              s = s.replace(old, new, 1)
          old = '    .invtitle .num{color:#8b0000}\n'
          new = old + '    .invtitle .courier{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:#64748b;margin-top:6px;text-transform:none}\n'
          if '.invtitle .courier{' not in s and old in s:
              s = s.replace(old, new, 1)
          old = 'type InvoiceOrder = OrderRow & { courier_consignment?: string | null };'
          new = 'type InvoiceOrder = OrderRow & { courier_consignment?: string | null; courier_display_name?: string | null };'
          if 'type InvoiceOrder = OrderRow & { courier_consignment?: string | null; courier_display_name?' not in s and old in s:
              s = s.replace(old, new, 1)
          old = '<div class="invtitle">${invHtml}</div>'
          new = '<div class="invtitle">${invHtml}${o.courier_display_name ? `<span class="courier">${escapeHtml(o.courier_display_name)}</span>` : ""}</div>'
          if 'o.courier_display_name ?' not in s and old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/courier-test.functions.ts')
          s = p.read_text()
          # Always persist the configured Display Name, including the Already Entry path.
          old = 'if (o.courier_consignment) {\n        results.push({ id: o.id, ok: false, already: true, consignment: o.courier_consignment, message: "ইতিমধ্যে এন্ট্রি হয়েছে (Already entry)" });'
          new = 'if (o.courier_consignment) {\n        await supabaseAdmin.from("orders").update({ courier_display_name: (cfg.display_name || "").trim() || `Courier ${account}` }).eq("id", o.id);\n        results.push({ id: o.id, ok: false, already: true, consignment: o.courier_consignment, message: "ইতিমধ্যে এন্ট্রি হয়েছে (Already entry)" });'
          if old in s and 'update({ courier_display_name:' not in s:
              s = s.replace(old, new, 1)
          old = 'courier_consignment: existing || invoice, courier_status: dstatus || "in_review"'
          new = 'courier_consignment: existing || invoice, courier_status: dstatus || "in_review", courier_display_name: (cfg.display_name || "").trim() || `Courier ${account}`'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'courier_consignment: consignment, courier_status: "in_review"'
          new = 'courier_consignment: consignment, courier_status: "in_review", courier_display_name: (cfg.display_name || "").trim() || `Courier ${account}`'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          Path('supabase/migrations/20260819210000_add_courier_display_name_to_orders.sql').write_text('ALTER TABLE public.orders ADD COLUMN IF NOT EXISTS courier_display_name text;\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx src/lib/courier-test.functions.ts supabase/migrations/20260819210000_add_courier_display_name_to_orders.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: persist courier display name for already-sent orders'
          git push origin HEAD:main