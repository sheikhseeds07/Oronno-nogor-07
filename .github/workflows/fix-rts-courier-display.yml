name: Fix RTS courier display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RTS labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/orders.tsx')
          s = p.read_text()
          # Replace the visible labels with expressions using display names.
          s = s.replace('কুরিয়ার ১ এ পাঠান (Steadfast)', '{courier1Name} এ পাঠান')
          s = s.replace('কুরিয়ার ২ এ পাঠান (Steadfast)', '{courier2Name} এ পাঠান')
          # If the state/fetch block is absent, insert it next to sendBulk.
          if 'const courier1Name' not in s:
              marker = '  const sendBulk = useServerFn(sendOrdersToSteadfast);'
              insert = '''  const sendBulk = useServerFn(sendOrdersToSteadfast);\n  const [courierDisplayNames, setCourierDisplayNames] = useState<Record<1 | 2, string>>({ 1: "কুরিয়ার ১", 2: "কুরিয়ার ২" });\n  useEffect(() => {\n    let alive = true;\n    (async () => {\n      const { data } = await supabase.from("integrations").select("name,config").in("name", ["all_api_steadfast", "all_api_steadfast_2"]);\n      if (!alive) return;\n      const next: Record<1 | 2, string> = { 1: "কুরিয়ার ১", 2: "কুরিয়ার ২" };\n      for (const row of data ?? []) {\n        const cfg = (row.config ?? {}) as { display_name?: string };\n        if (row.name === "all_api_steadfast" && cfg.display_name?.trim()) next[1] = cfg.display_name.trim();\n        if (row.name === "all_api_steadfast_2" && cfg.display_name?.trim()) next[2] = cfg.display_name.trim();\n      }\n      if (alive) setCourierDisplayNames(next);\n    })();\n    return () => { alive = false; };\n  }, []);\n  const courier1Name = courierDisplayNames[1];\n  const courier2Name = courierDisplayNames[2];'''
              if marker not in s:
                  raise SystemExit('sendBulk marker not found')
              s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
          grep -n "courier1Name\|courier2Name" src/routes/admin/orders.tsx
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin/orders.tsx
          if git diff --cached --quiet; then echo 'No RTS patch needed'; exit 0; fi
          git commit -m 'Fix RTS buttons to use configured courier names'
          git push origin HEAD:main
