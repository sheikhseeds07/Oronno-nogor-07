name: Finalize SeedCombo CTA
on:
  push:
    branches: [fix/seedcombo-floating-cta-final]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'aria-label="অর্ডার কনফার্ম করুন - ৳২৯৯" className="hng-floating-order'
          new = 'aria-label="অর্ডার কনফার্ম করুন - ৳২৯৯" data-seedcombo-cta="true" className="hng-floating-order'
          if old not in s:
              raise SystemExit('SeedCombo CTA target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/seedcombo-finalize.yml').unlink(missing_ok=True)
          PY
      - name: Commit final source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/ProductStyleLandingPage.tsx .github/workflows/seedcombo-finalize.yml
          git commit -m 'fix(landing): finalize SeedCombo floating checkout CTA'
          git push