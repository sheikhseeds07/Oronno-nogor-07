name: Fix landing product selector and checkout
on:
  push:
    branches: [main]
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix landing product selector and checkout') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile product selector and checkout layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/landing/CleanLandingPage.tsx')
          s=p.read_text()
          old='''const LANDING_CHECKOUT_GROUP_STYLE = `
.lp-product-checkout-group { border:1px solid rgb(226 232 240); border-radius:16px; background:white; overflow:hidden; }
.lp-product-checkout-group .lp-product-selector { padding:16px; margin:0; border-bottom:1px solid rgb(226 232 240); }
.lp-product-checkout-group > section { padding:16px; margin:0; }
.lp-product-checkout-group .lp-product-selector > div,.lp-product-checkout-group > section > div { margin-bottom:0; }
`;'''
          new='''const LANDING_CHECKOUT_GROUP_STYLE = `
.lp-product-checkout-group { border:1px solid #dbe7df; border-radius:18px; background:#fff; overflow:visible; position:relative; z-index:2; }
.lp-product-checkout-group .lp-product-selector { padding:9px !important; margin:0 !important; border-bottom:1px solid #e5eee8 !important; background:#fbfefc !important; }
.lp-product-checkout-group .lp-product-selector > div { margin:0 !important; }
.lp-product-checkout-group .lp-product-selector button { width:100% !important; min-height:68px !important; height:68px !important; display:flex !important; align-items:center !important; gap:10px !important; padding:7px 10px !important; margin:0 0 6px !important; border-radius:13px !important; overflow:hidden !important; }
.lp-product-checkout-group .lp-product-selector button:last-child { margin-bottom:0 !important; }
.lp-product-checkout-group .lp-product-selector button img { width:52px !important; height:52px !important; min-width:52px !important; min-height:52px !important; max-width:52px !important; max-height:52px !important; object-fit:cover !important; border-radius:10px !important; flex:0 0 52px !important; }
.lp-product-checkout-group .lp-product-selector button p,.lp-product-checkout-group .lp-product-selector button span { white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; line-height:1.2 !important; }
.lp-product-checkout-group .lp-product-selector button > div { min-width:0 !important; }
.lp-product-checkout-group > section { padding:11px !important; margin:0 !important; position:relative; z-index:1; }
.lp-product-checkout-group > section > div { margin-bottom:0 !important; }
#order { scroll-margin-top:78px !important; }
#order #lp-order-form { overflow:visible !important; position:relative !important; z-index:1 !important; }
@media (max-width:640px) {
  .lp-product-checkout-group { border-radius:16px !important; }
  .lp-product-checkout-group .lp-product-selector { padding:7px !important; }
  .lp-product-checkout-group .lp-product-selector button { min-height:62px !important; height:62px !important; padding:5px 7px !important; gap:8px !important; border-radius:11px !important; }
  .lp-product-checkout-group .lp-product-selector button img { width:46px !important; height:46px !important; min-width:46px !important; min-height:46px !important; max-width:46px !important; max-height:46px !important; border-radius:8px !important; flex-basis:46px !important; }
  .lp-product-checkout-group > section { padding:9px !important; }
  .lp-product-checkout-group > section input:not([type=checkbox]),.lp-product-checkout-group > section textarea { width:100% !important; box-sizing:border-box !important; }
}
`;'''
          if old not in s:
              raise SystemExit('style block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          wf=Path('.github/workflows/fix-landing-product-checkout.yml')
          wf.unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/CleanLandingPage.tsx .github/workflows/fix-landing-product-checkout.yml
          git commit -m 'Fix landing product selector and checkout layout [skip ci]'
          git push
