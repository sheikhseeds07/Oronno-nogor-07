name: inline-phone-validation
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_phone.py
      - name: Commit
        run: |
          git config user.name "lovable-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: inline red BD phone validation on all landing pages"
          git push
