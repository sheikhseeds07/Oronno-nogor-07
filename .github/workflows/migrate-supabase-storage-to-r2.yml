name: Migrate Supabase Storage to R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-supabase-storage-to-r2.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [run-r2-migration]

concurrency:
  group: supabase-storage-to-r2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AWS CLI
        run: aws --version

      - name: Discover R2 buckets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN_R2 }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api list-buckets             --endpoint-url https://a91d9451c87479d4d01d2d2add2530f5.r2.cloudflarestorage.com             --region auto             --query 'Buckets[].Name'             --output json
