name: Patch Courier Notes Navigation

on:
  push:
    branches: [feat/courier-rescue-center]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/AdminLayout.tsx')
          s = p.read_text()
          old_import = 'PanelLeftClose, PanelLeftOpen, ChevronRight, Sparkles, Leaf } from "lucide-react";'
          new_import = 'PanelLeftClose, PanelLeftOpen, ChevronRight, Sparkles, Leaf, Truck } from "lucide-react";'
          if old_import in s and 'ChevronRight, Sparkles, Leaf, Truck' not in s:
              s = s.replace(old_import, new_import, 1)
          old_nav = '  { to: "/admin/settings", label: "Settings", icon: Settings, perm: "settings", tone: "from-slate-300 to-slate-500" },\n];'
          new_nav = '  { to: "/admin/settings", label: "Settings", icon: Settings, perm: "settings", tone: "from-slate-300 to-slate-500" },\n  { to: "/admin/courier-notes", label: "Courier Notes", icon: Truck, perm: "courier_notes", tone: "from-orange-400 to-rose-500" },\n];'
          if old_nav in s and '/admin/courier-notes' not in s:
              s = s.replace(old_nav, new_nav, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-courier-nav.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/AdminLayout.tsx .github/workflows/patch-courier-nav.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(courier): add permission-gated courier notes navigation'
          git push
