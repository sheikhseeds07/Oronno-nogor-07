name: Remove Product Image Text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor == 'shawon079' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove all content rendered directly below product image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/landing/ProductStyleLandingPage.tsx')
          s = p.read_text(encoding='utf-8')
          marker = 'className="order-2 py-0"'
          if marker not in s:
              raise SystemExit('Target product-image-below block was not found; refusing to modify the file.')
          s = s.replace(marker, 'className="hidden"', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build verification
        run: bun run build

      - name: Commit verified change and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git rm .github/workflows/remove-product-image-text.yml
          git commit -m "Remove redundant Product Style image text" \
            -m "Hide the dedicated content block directly below the product image after a successful production build verification."
          git push origin main
