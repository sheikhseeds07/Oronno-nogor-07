name: One-time dashboard card polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply equal card layout and animations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/PremiumDashboard.tsx')
          s = p.read_text()
          old = '''function Card({title,value,hint,icon:Icon,tone}:{title:string;value:string;hint:string;icon:any;tone:string}){return <div className={`group rounded-2xl border bg-white p-4 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl ${tone}`}><div className="flex items-center justify-between"><div className="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-50"><Icon className="h-5 w-5"/></div><Activity className="h-4 w-4 opacity-30"/></div><div className="mt-3 text-[11px] text-slate-500">{title}</div><div className="mt-1 text-2xl font-black text-slate-900">{value}</div><div className="mt-1 text-[10px] text-slate-400">{hint}</div></div>}'''
          new = '''function Card({title,value,hint,icon:Icon,tone}:{title:string;value:string;hint:string;icon:any;tone:string}){return <div className={`group flex h-full min-h-[176px] min-w-0 flex-col rounded-2xl border bg-white p-4 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:scale-[1.01] hover:shadow-2xl ${tone}`}><div className="flex items-center justify-between"><div className="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-50 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-3"><Icon className="h-5 w-5"/></div><Activity className="h-4 w-4 opacity-30 transition-all duration-500 group-hover:scale-125 group-hover:opacity-60"/></div><div className="mt-3 text-[11px] text-slate-500">{title}</div><div className="mt-1 text-2xl font-black text-slate-900 transition-transform duration-300 group-hover:translate-x-0.5">{value}</div><div className="mt-auto pt-1 text-[10px] text-slate-400">{hint}</div></div>}'''
          if old not in s:
              raise SystemExit('Card block not found')
          s = s.replace(old, new, 1)
          s = s.replace('return <div className="xl:col-span-2"><div onClick=', 'return <div className="min-w-0"><div onClick=', 2)
          s = s.replace('className={`group cursor-pointer overflow-hidden rounded-2xl border bg-white p-4 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl ${open?', 'className={`group flex h-full min-h-[176px] min-w-0 cursor-pointer flex-col overflow-hidden rounded-2xl border bg-white p-4 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:scale-[1.01] hover:shadow-2xl ${open?', 2)
          s = s.replace('function LiveVisitorsCard({live,today}:{live:number;today:number}){return <div className="group rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl xl:col-span-2">', 'function LiveVisitorsCard({live,today}:{live:number;today:number}){return <div className="group flex h-full min-h-[176px] min-w-0 flex-col rounded-2xl border border-emerald-200 bg-white p-4 shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 hover:scale-[1.01] hover:shadow-2xl">', 1)
          s = s.replace('<div className="mb-4 grid grid-cols-2 gap-3 xl:grid-cols-6">', '<div className="mb-4 grid grid-cols-2 gap-3 xl:grid-cols-5">', 1)
          p.write_text(s)
          PY
          if git diff --quiet -- src/components/admin/PremiumDashboard.tsx; then
            echo "No dashboard changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/PremiumDashboard.tsx
          git commit -m "fix: make dashboard stat cards equal and polished"
          git push
