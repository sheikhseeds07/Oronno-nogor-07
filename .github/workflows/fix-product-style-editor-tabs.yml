name: Fix Product Style editor tabs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Product Style editor tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/admin/landing-pages.tsx')
          s = p.read_text()
          pattern = r'''(\[\"main\", \"Main\"\],\s*\[\"page\", \"Full page\"\],\s*)(\.\.\.\(C\.template === \"all\" \? \[\] : \[\[\"content\", \"কনটেন্ট\"\] as const\]\),\s*)(\[\"products\", \"Products\"\],)'''
          replacement = r'''\1...(C.template === \"all\" || C.template === \"product\" ? [] : [[\"content\", \"কনটেন্ট\"] as const]),
                [\"products\", C.template === \"product\" ? \"Product\" : \"Products\"],'''
          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('Product Style editor tab block not found; refusing to modify the file.')
          p.write_text(updated)
          PY

      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/landing-pages.tsx
          git commit -m "Hide content tab for Product Style landing pages"
          git push
