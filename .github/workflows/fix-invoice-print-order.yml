name: Fix invoice print order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Let the build triggered by this temporary workflow commit finish first.
      - name: Wait for current build
        run: sleep 300

      - name: Apply invoice sorting fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/admin/orders.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''  const bulkPrintInvoice = async () => {\n    const picked = rows.filter((o) => selectedIds.has(o.id));'''
          new = '''  const bulkPrintInvoice = async () => {\n    const picked = rows\n      .filter((o) => selectedIds.has(o.id))\n      .sort((a, b) => {\n        const aInvoice = (a.invoice_no ?? a.id).toUpperCase();\n        const bInvoice = (b.invoice_no ?? b.id).toUpperCase();\n        return aInvoice.localeCompare(bInvoice, undefined, { numeric: true, sensitivity: "base" });\n      });'''

          if old not in text:
              raise SystemExit("Target invoice print code was not found; no change made.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/fix-invoice-print-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx .github/workflows/fix-invoice-print-order.yml
          git commit -m "Fix invoice print order by invoice ID"
          git push origin main
