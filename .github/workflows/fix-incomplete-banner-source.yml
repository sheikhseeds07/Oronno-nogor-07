name: Fix incomplete order banner source persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch only incomplete banner logic
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/routes/admin/orders.tsx")
          text = path.read_text(encoding="utf-8")

          if "isIncompleteSource" in text:
              raise SystemExit("Patch already present")

          # Add a small source check inside DetailModal. This intentionally
          # leaves all existing order/status logic untouched.
          fn = re.search(r'(function\s+DetailModal\s*\([^)]*\)\s*\{)', text)
          if not fn:
              raise SystemExit("DetailModal function not found")

          insert_at = fn.end()
          source_check = '''\n  const [isIncompleteSource, setIsIncompleteSource] = useState(false);\n  useEffect(() => {\n    let active = true;\n    supabase.from("orders").select("source").eq("id", id).maybeSingle().then(({ data }) => {\n      if (active) setIsIncompleteSource(data?.source === "incomplete");\n    });\n    return () => { active = false; };\n  }, [id]);\n'''
          text = text[:insert_at] + source_check + text[insert_at:]

          old = "{isDraft && ("
          new = "{(isDraft || isIncompleteSource) && ("
          if old not in text:
              raise SystemExit("Incomplete banner condition not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Build verification
        run: |
          corepack enable || true
          bun --version || true
          bun install --frozen-lockfile
          bun run build

      - name: Commit only banner fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx
          git rm .github/workflows/fix-incomplete-banner-source.yml
          git commit -m "Fix incomplete banner across order statuses"
          git push
