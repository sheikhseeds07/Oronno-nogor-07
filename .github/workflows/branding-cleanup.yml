name: One-time Sheikh Seeds branding cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'one-time Sheikh Seeds branding cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old visible brand names
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'অরন্য নগর': 'Sheikh Seeds',
              'অরণ্য নগর': 'Sheikh Seeds',
              'Oronno Nogor': 'Sheikh Seeds',
          }
          for root in (Path('src'), Path('public'), Path('README.md')):
              paths = [root] if root.is_file() else root.rglob('*')
              for p in paths:
                  if not p.is_file() or p.suffix in {'.png','.jpg','.jpeg','.gif','.webp','.ico'}:
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  new = text
                  for old, value in replacements.items():
                      new = new.replace(old, value)
                  if new != text:
                      p.write_text(new, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public README.md
          git diff --cached --quiet && exit 0
          git commit -m 'one-time Sheikh Seeds branding cleanup'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/branding-cleanup.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary branding cleanup workflow'
          git push
