name: Final Product Style fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-fix-product-style.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Restore known-good Product Style source and hide image-below block
        run: |
          git checkout 5af0f35dc5a3c9918d828a1946ae6c48fe659ad1 -- src/components/landing/ProductStyleLandingPage.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/landing/ProductStyleLandingPage.tsx')
          s=p.read_text(encoding='utf-8')
          marker='className="order-2 py-0 sm:py-1"'
          if marker not in s:
              raise SystemExit('Expected image-below wrapper not found')
          p.write_text(s.replace(marker,'className="hidden"',1),encoding='utf-8')
          PY
      - name: Verify production build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit and push verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/ProductStyleLandingPage.tsx
          git rm .github/workflows/final-fix-product-style.yml
          git commit -m "Fix Product Style image block after build verification"
          git push origin main
