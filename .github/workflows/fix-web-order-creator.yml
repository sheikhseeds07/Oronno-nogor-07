name: Fix web order creator tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set creator when web order is confirmed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/admin-order.functions.ts')
          s = p.read_text()
          old = '...(data.confirm ? { status: "pending" as const } : {}),'
          new = '...(data.confirm ? { status: "pending" as const, created_by: context.userId } : {}),'
          if old not in s:
              raise SystemExit('Expected confirm status update not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-web-order-creator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/admin-order.functions.ts .github/workflows/fix-web-order-creator.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: track employee who creates web orders"
          git push
