name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep every main build check running to completion instead of cancelling
# the previous build when another main push arrives.
concurrency:
  group: build-check-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time admin assignee display patch
        shell: python
        run: |
          from pathlib import Path
          marker = Path(".github/assignee-patch-needed")
          if not marker.exists():
              raise SystemExit(0)
          p = Path("src/routes/admin/orders.tsx")
          s = p.read_text()
          dup = '''                          {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}\n                          {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}'''
          one = '''                          {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}'''
          if dup in s:
              s = s.replace(dup, one, 1)
          old = '''                        <Link to="/admin/orders" search={linkSearch} onClick={handleClick} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-blue-200 bg-blue-50 text-blue-700 text-xs font-semibold hover:bg-blue-100" title="অর্ডার ওপেন (রাইট ক্লিক / নতুন ট্যাবে খুলুন)">\n                          Open <ExternalLink className="w-3 h-3" />\n                        </Link>\n                        {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          new = '''                        <Link to="/admin/orders" search={linkSearch} onClick={handleClick} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-blue-200 bg-blue-50 text-blue-700 text-xs font-semibold hover:bg-blue-100" title="অর্ডার ওপেন (রাইট ক্লিক / নতুন ট্যাবে খুলুন)">\n                          Open <ExternalLink className="w-3 h-3" />\n                        </Link>\n                        {isAdmin && assignedName && <span className="text-[10px] text-slate-600 font-semibold mt-1 max-w-[150px] truncate">Assigned to: {assignedName}</span>}\n                        {creatorName && <span className="text-[10px] text-red-600 font-semibold mt-1 max-w-[150px] truncate">Created by: {creatorName}</span>}'''
          if old not in s:
              raise SystemExit("open action target not found")
          p.write_text(s.replace(old, new, 1))
          marker.unlink()
      - name: Commit one-time assignee patch
        if: ${{ hashFiles('.github/assignee-patch-needed') != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/orders.tsx .github/assignee-patch-needed
          git commit -m "fix: show assignee once under Open for admins [skip assignee patch]"
          git push

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full production build — this check must pass on every main push.
      - name: Build
        run: bun run build
