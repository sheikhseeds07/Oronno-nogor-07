name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep every main build check running to completion instead of cancelling
# the previous build when another main push arrives.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Storage failure handling
        run: bun run check:storage

      # Full production build — optimization must never merge if the build fails.
      - name: Build
        env:
          R2_PUBLIC_URL: /media
        run: bun run build
