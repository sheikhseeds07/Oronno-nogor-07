name: Apply customer community migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-customer-community.yml'
      - 'supabase/migrations/20260906000000_customer_community.sql'
      - 'supabase/migrations/20260906040000_community_media_storage.sql'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SHEIKH }}
          PROJECT_REF: frtzlibogmethppqmhtr
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          def run(query, timeout=180):
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
                  data=json.dumps({'query': query}).encode(),
                  headers={
                      'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                      'Content-Type': 'application/json',
                      'User-Agent': 'GitHub-Actions-Community/1.0',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as exc:
                  raise SystemExit('Query failed: ' + exc.read().decode())

          for path in [
              'supabase/migrations/20260906000000_customer_community.sql',
              'supabase/migrations/20260906040000_community_media_storage.sql',
          ]:
              print('applying:', path)
              print('status:', run(Path(path).read_text())[0])

          _, tables = run("select table_name from information_schema.tables where table_schema='public' and table_name in ('customer_profiles','product_reviews','product_questions','social_posts','social_post_likes','social_post_comments','social_post_reactions','social_stories','social_story_views')", 60)
          print('tables:', tables)
          for table in ['social_posts','social_post_reactions','social_stories']:
              if table not in tables:
                  raise SystemExit('Missing table: ' + table)

          _, bucket = run("select id, public from storage.buckets where id='community-media'", 60)
          print('community-media bucket:', bucket)
          if 'community-media' not in bucket:
              raise SystemExit('Missing community-media bucket')
          PYCODE
