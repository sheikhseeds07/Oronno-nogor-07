name: Apply Seedcombo Checkout Redesign
on:
  push:
    paths:
      - '.github/workflows/update-seedcombo-checkout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update checkout layout and seedcombo background
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/landing/CleanLandingPage.tsx')
          text = path.read_text()

          style = '''const LANDING_CHECKOUT_GROUP_STYLE = `
          .lp-product-checkout-group { border:1px solid #dfeae2; border-radius:18px; background:#fff; overflow:hidden; }
          .lp-product-checkout-group .lp-checkout-shell { border-top:1px solid #dfeae2; }
          .lp-product-checkout-group .lp-inline-selector { padding:8px 10px; margin:0; border-bottom:1px solid #edf3ee; background:#fff; }
          .lp-product-checkout-group .lp-inline-title { font-size:11px; font-weight:800; color:#64748b; margin-bottom:6px; }
          .lp-product-checkout-group .lp-inline-options { display:flex; flex-direction:column; gap:5px; }
          .lp-product-checkout-group .lp-inline-option { min-height:48px; padding:6px 8px; border-radius:10px; }
          .lp-product-checkout-group .lp-inline-option img { width:34px; height:34px; border-radius:8px; }
          .lp-product-checkout-group .lp-inline-option .lp-option-name { font-size:12px; line-height:1.25; }
          .lp-product-checkout-group .lp-inline-option .lp-option-price { font-size:13px; }
          .lp-product-checkout-group .lp-inline-summary { border:0; border-top:1px solid #edf3ee; border-radius:0; }
          .lp-product-checkout-group .lp-inline-summary > div { padding-top:7px; padding-bottom:7px; }
          @media (max-width:640px) {
            .lp-product-checkout-group .lp-inline-selector { padding:7px 8px; }
            .lp-product-checkout-group .lp-inline-option { min-height:46px; padding:5px 7px; }
          }
          `;'''
          text = re.sub(r'const LANDING_CHECKOUT_GROUP_STYLE = `.*?`;\n', style + '\n', text, count=1, flags=re.S)

          text = text.replace(' const orderSectionRef=useRef<HTMLElement|null>(null); const productSelectionRef=useRef<HTMLElement|null>(null);', ' const orderSectionRef=useRef<HTMLElement|null>(null);')
          text = text.replace(' const scrollToProductSelection=()=>{const target=productSelectionRef.current;if(target){target.scrollIntoView({behavior:"smooth",block:"start"});return;}scrollToOrder();};', ' const scrollToProductSelection=scrollToOrder;')
          text = text.replace('onClick={scrollToProductSelection}', 'onClick={scrollToOrder}')

          start = text.find('{packages.length>1&&<div ref={productSelectionRef}>')
          order_start = text.find('<section id="order"', start)
          if start != -1 and order_start != -1:
              text = text[:start] + text[order_start:]

          text = text.replace('const [submitting,setSubmitting]=useState(false); const [selectedPkg,setSelectedPkg]=useState(0); const [form,setForm]=useState', 'const [submitting,setSubmitting]=useState(false); const [selectedPkg,setSelectedPkg]=useState(0); const [selectedPayment,setSelectedPayment]=useState("cod"); const [form,setForm]=useState')
          needle = ' const selected=packages[selectedPkg]||packages[0]; const subtotal=selected?selected.price:price; const deliveryFee=selected?selected.delivery_fee:defaultDelivery; const total=subtotal+deliveryFee;'
          replacement = needle + ' const paymentMethods=[{id:"cod",label:"ক্যাশ অন ডেলিভারি",description:"পণ্য হাতে পেয়ে পেমেন্ট করুন"}];'
          text = text.replace(needle, replacement)

          old_order = '<section id="order" ref={orderSectionRef} className="scroll-mt-20 lp-product-checkout-group"><SectionHead kicker={packages.length>1?C.order_kicker:"অর্ডার"} title={C.order_title}/>{C.order_note&&<p className="text-center text-[13px] font-medium text-emerald-800 bg-emerald-50 rounded-xl px-4 py-3 mb-3 leading-relaxed">{C.order_note}</p>}<div className="rounded-2xl border border-emerald-100 bg-white overflow-hidden"><form id="lp-order-form" onSubmit={submit} className="p-4 sm:p-5 space-y-4">'
          new_order = '<section id="order" ref={orderSectionRef} className="scroll-mt-20 lp-product-checkout-group"><div className="lp-checkout-shell rounded-2xl bg-white overflow-hidden"><form id="lp-order-form" onSubmit={submit} className="p-3 sm:p-4 space-y-3">'
          if old_order not in text:
              raise SystemExit('order opening pattern not found')
          text = text.replace(old_order, new_order, 1)

          summary_start = text.find('<div className="rounded-xl border border-slate-200 divide-y divide-slate-100 text-sm overflow-hidden">')
          submit_start = text.find('<button type="submit" disabled={submitting}', summary_start)
          if summary_start == -1 or submit_start == -1:
              raise SystemExit('summary pattern not found')
          inline = '''<div className="lp-inline-selector">
          <div className="lp-inline-title">প্যাকেজ সিলেক্ট করুন</div>
          <div className="lp-inline-options">{packages.map((p,i)=>{const active=selectedPkg===i;return <button type="button" key={i} onClick={()=>setSelectedPkg(i)} className="lp-inline-option w-full flex items-center gap-2 border text-left transition bg-white" style={active?{borderColor:themeColor,background:themeBg05,boxShadow:`0 0 0 1px ${themeColor}`}:{borderColor:"#dcece0"}}>{p.image&&<img src={toImg(p.image)} alt="" width={34} height={34} loading="lazy" decoding="async" className="shrink-0 object-cover bg-slate-50"/>}<div className="flex-1 min-w-0"><div className="lp-option-name font-semibold text-slate-900">{p.label}</div>{p.badge&&<span className="inline-block mt-0.5 text-[9px] px-1.5 py-0.5 rounded font-semibold" style={{background:themeBg10,color:themeColor}}>{p.badge}</span>}</div><div className="lp-option-price text-right font-bold text-slate-900 shrink-0">{taka(p.price)}</div><span className="grid place-items-center w-4 h-4 rounded-full border-2 shrink-0" style={active?{background:themeColor,borderColor:themeColor}:{borderColor:"#cbd5e1"}}>{active&&<Check className="w-2.5 h-2.5 text-white" strokeWidth={3}/>}</span></button>})}</div>
          </div>
          <div className="lp-inline-selector">
          <div className="lp-inline-title">পেমেন্ট মাধ্যম</div>
          <div className="lp-inline-options">{paymentMethods.map(method=>{const active=selectedPayment===method.id;return <button type="button" key={method.id} onClick={()=>setSelectedPayment(method.id)} className="lp-inline-option w-full flex items-center gap-2 border text-left transition bg-white" style={active?{borderColor:themeColor,background:themeBg05,boxShadow:`0 0 0 1px ${themeColor}`}:{borderColor:"#dcece0"}}><span className="grid place-items-center w-8 h-8 rounded-lg shrink-0" style={{background:themeBg10,color:themeColor}}><Wallet className="w-4 h-4"/></span><div className="flex-1 min-w-0"><div className="lp-option-name font-semibold text-slate-900">{method.label}</div><div className="text-[10px] text-slate-500">{method.description}</div></div><span className="grid place-items-center w-4 h-4 rounded-full border-2 shrink-0" style={active?{background:themeColor,borderColor:themeColor}:{borderColor:"#cbd5e1"}}>{active&&<Check className="w-2.5 h-2.5 text-white" strokeWidth={3}/>}</span></button>})}</div>
          </div>
          <div className="lp-inline-summary text-sm divide-y divide-slate-100 overflow-hidden">
          <div className="flex justify-between px-3.5"><span className="text-slate-500">সাবটোটাল</span><span className="font-semibold text-slate-900">{taka(subtotal)}</span></div><div className="flex justify-between px-3.5"><span className="text-slate-500">ডেলিভারি ফি</span><span className="font-semibold text-slate-900">{deliveryFee===0?"ফ্রি":taka(deliveryFee)}</span></div><div className="flex justify-between px-3.5 bg-emerald-50/60"><span className="font-bold text-slate-900">সর্বমোট</span><span className="font-bold text-[16px]" style={{color:themeColor}}>{taka(total)}</span></div>
          </div>
          '''
          text = text[:summary_start] + inline + text[submit_start:]

          # Seed Combo only: premium agricultural background with soft botanical-green depth.
          root_old = 'return <div className="lp-root min-h-screen bg-white text-slate-700" style={{["--lp" as string]:themeColor}}>'
          root_new = 'return <div className="lp-root min-h-screen text-slate-700" style={{["--lp" as string]:themeColor,background:slug==="seedcombo"?"radial-gradient(circle at 8% 8%,rgba(34,197,94,.13),transparent 24%),radial-gradient(circle at 92% 20%,rgba(21,128,61,.09),transparent 22%),repeating-linear-gradient(135deg,rgba(22,101,52,.018) 0,rgba(22,101,52,.018) 1px,transparent 1px,transparent 11px),linear-gradient(180deg,#edf9f0 0%,#ffffff 32%,#f6fbf7 72%,#eef8f1 100%)":"#fff"}}>'
          if root_old not in text:
              raise SystemExit('seedcombo root pattern not found')
          text = text.replace(root_old, root_new, 1)

          path.write_text(text)
          print('updated', path)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/CleanLandingPage.tsx
          git commit -m "feat: premium agriculture background for seedcombo"
          git push
          git rm .github/workflows/update-seedcombo-checkout.yml
          git commit -m "chore: remove one-time seedcombo checkout workflow"
          git push
